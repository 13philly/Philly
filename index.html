<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e31837">
<title>Phillies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#061225;--c:#0b1b32;--c2:#0e2441;--l:#193553;--r:#e31837;--w:#f5f7fb;--m:#7187a3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--w);font-family:Inter,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 50% -8%,#193b67,#0a1a32 34%,#061225 70%)}
button,select{font:inherit;cursor:pointer}
.app{max-width:560px;min-height:100vh;margin:auto;padding-bottom:106px}
header{position:sticky;top:0;z-index:30;height:76px;display:flex;align-items:center;padding:0 16px;overflow:hidden;background:linear-gradient(112deg,#b90e2c,#e31837 56%,#b40d2a);box-shadow:0 8px 25px #0005}
header:before{content:"";position:absolute;inset:0 auto 0;width:65%;background:linear-gradient(115deg,transparent,#ffffff13 45%,transparent 46%);transform:skewX(-18deg)}
header:after{content:"";position:absolute;right:-45px;top:-75px;width:210px;height:210px;border:27px solid #ffffff0d;border-radius:50%}
.header-logo{position:relative;z-index:2;height:51px;width:auto;max-width:205px;object-fit:contain;filter:drop-shadow(0 4px 8px #0005)}
.header-detail{position:absolute;z-index:2;right:16px;bottom:13px;width:72px}
.header-detail b{display:block;height:2px;background:#fff9}
.header-detail i{display:block;width:25px;height:2px;margin-top:4px;background:#ffffff45}
.page{display:none;padding:22px 15px}
.page.show{display:block}
.eyebrow{font-size:6px;font-weight:900;color:var(--m);letter-spacing:1.6px;margin-bottom:5px}
h1{margin:0;font:900 46px/.82 "Barlow Condensed"}
.section{display:flex;align-items:end;justify-content:space-between;margin:27px 2px 10px}
.section>b{font:900 19px/.8 "Barlow Condensed"}
.section>span{font-size:5px;color:var(--m);font-weight:900;letter-spacing:1px}
.card{border:1px solid var(--l);border-radius:17px;background:linear-gradient(145deg,var(--c2),var(--c));box-shadow:0 12px 28px #00025}
.live-card{position:relative;overflow:hidden}
.live-card:before{content:"";position:absolute;right:-70px;top:-85px;width:205px;height:205px;border-radius:50%;border:32px solid #e3183714}
.game-head,.game-foot{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:13px 15px}
.game-head{border-bottom:1px solid var(--l)}
.live{display:flex;align-items:center;gap:7px;color:#ff647d;font-size:6px;font-weight:900;letter-spacing:1px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--r);box-shadow:0 0 0 5px #e3183720}
.game-state,.game-foot{font-size:5px;color:var(--m);font-weight:900}
.score{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:15px;padding:34px 15px 29px}
.score strong{font:900 58px/.75 "Barlow Condensed"}
.score .team{font:900 29px/.8 "Barlow Condensed"}
.game-foot{border-top:1px solid var(--l);letter-spacing:.6px}
.game-btn{position:relative;z-index:2;margin:0 15px 15px;width:calc(100% - 30px);padding:11px;border:1px solid #ff5268;background:#d91534;border-radius:8px;color:#fff;font-size:6px;font-weight:900;letter-spacing:.8px}
.latest-head{display:flex;align-items:center;justify-content:space-between;gap:7px}
.latest-head>b{font:900 19px/.8 "Barlow Condensed"}
.news-tools{display:flex;gap:5px}
.news-select{position:relative}
.news-select select{appearance:none;outline:0;height:29px;min-width:67px;padding:0 21px 0 8px;border:1px solid var(--l);border-radius:7px;background:#0a1b34;color:#dce4ed;font-size:5px;font-weight:900}
.news-select:after{content:"⌄";position:absolute;right:7px;top:50%;transform:translateY(-55%);color:#7087a2;pointer-events:none}
.news-grid{display:grid;gap:10px}
.news{position:relative;padding:14px 13px 12px;border:1px solid var(--l);border-radius:14px;background:linear-gradient(145deg,#0d213b,#09192f);box-shadow:0 7px 18px #00022;cursor:pointer}
.news:active{transform:scale(.988)}
.news.unread{border-color:#29415c}
.news.unread:before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--r)}
.nmeta{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.source{font-size:5px;color:#ff6078;font-weight:900}
.dot{width:3px;height:3px;border-radius:50%;background:#526b88}
.time,.published,.read{font-size:5px;color:#627995}
.nt{font:800 16px/1.07 "Barlow Condensed"}
.nj{margin-top:5px;color:#b7c4d2;font:700 10px/1.25 Inter}
.nbottom{display:flex;align-items:center;margin-top:11px}
.published{margin-left:auto;margin-right:9px}
.unread .read{color:#ff6078}
.save{position:relative;width:28px;height:28px;border:1px solid #29435f;border-radius:8px;background:#0a1b34;color:#7187a3}
.save:before{content:"";position:absolute;left:9px;top:7px;width:8px;height:11px;border:1.3px solid currentColor;border-radius:2px}
.save:after{content:"";position:absolute;left:11px;top:14px;width:5px;height:5px;border-left:1.3px solid currentColor;border-bottom:1.3px solid currentColor;transform:rotate(-45deg);background:#0a1b34}
.save.on{color:#ff5871;border-color:#e3183755}
.stand{overflow:hidden}
.stand table{width:100%;border-collapse:collapse;table-layout:fixed}
.stand th,.stand td{border-bottom:1px solid var(--l)}
.stand th{height:32px;padding:0 10px;background:#07172d;color:#617995;font-size:5px;font-weight:900;text-align:right}
.stand th:first-child,.stand td:first-child{width:38px;text-align:center}
.stand th:nth-child(2),.stand td:nth-child(2){text-align:left}
.stand th:nth-child(n+3),.stand td:nth-child(n+3){width:42px;text-align:right}
.stand td{height:45px;padding:0 10px;font-size:7px}
.stand tr:last-child td{border:0}
.rank{font:900 16px "Barlow Condensed";color:var(--m)}
.tn{font-weight:900}
.num{font:800 11px "Barlow Condensed"}
.phi{background:#102a49}
.empty,.schedule-loading{min-height:70px;display:flex;align-items:center;justify-content:center;color:var(--m);font:900 12px "Barlow Condensed";letter-spacing:1px}

/* SCHEDULE */
.month-switch{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;gap:8px;margin:19px 0 15px}
.month-switch button{height:34px;border:1px solid var(--l);border-radius:8px;background:#0a1b34;color:#dce4ed;font-size:17px}
.month-label{text-align:center;font:900 22px/.8 "Barlow Condensed";letter-spacing:.5px}
.schedule-tools{display:flex;justify-content:flex-end;margin-bottom:12px}
.schedule-tools select{appearance:none;height:31px;padding:0 21px 0 8px;border:1px solid var(--l);border-radius:7px;background:#0a1b34;color:#dce4ed;font-size:5px;font-weight:900}
.schedule-list{display:grid;gap:9px}
.schedule-day{margin-top:18px}
.schedule-day:first-child{margin-top:0}
.schedule-date{display:flex;align-items:center;gap:8px;margin:0 3px 7px}
.schedule-date b{font:900 17px/.8 "Barlow Condensed"}
.schedule-date span{color:#607995;font-size:5px;font-weight:900}
.schedule-date i{height:1px;flex:1;background:linear-gradient(90deg,#29445f,transparent)}
.schedule-game{position:relative;padding:13px;border:1px solid var(--l);border-radius:15px;background:linear-gradient(145deg,#0d213b,#09192f);box-shadow:0 7px 18px #00022;overflow:hidden;cursor:pointer}
.schedule-game.today{border-color:#e3183759}
.schedule-game.win{border-left:3px solid #5bbf84}
.schedule-game.loss{border-left:3px solid #e05d72}
.schedule-game.next{border-left:3px solid #6e8cab}
.schedule-top{display:flex;justify-content:space-between;align-items:center;color:#607995;font-size:5px;font-weight:900}
.schedule-status{color:#ff6178}
.schedule-teams{display:grid;grid-template-columns:1fr 45px 1fr;align-items:center;gap:5px;margin-top:11px}
.schedule-team{text-align:center}
.schedule-team b{display:block;font:900 22px/.8 "Barlow Condensed"}
.schedule-team small{display:block;margin-top:5px;color:#6d829b;font-size:4px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.schedule-score{text-align:center;font:900 23px/.8 "Barlow Condensed"}
.schedule-score small{display:block;margin-top:5px;color:#607995;font-size:4px;font-weight:900}
.schedule-meta{display:flex;justify-content:space-between;gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid #193553;color:#637a95;font-size:4px;font-weight:900}
.schedule-meta span:last-child{text-align:right}

/* GAME CENTER */
.game-detail{padding:22px 15px 30px}
.back{width:38px;height:36px;border:1px solid var(--l);border-radius:9px;background:#0b1d36;color:#fff;font-size:23px}
.detail-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.detail-title{font:900 27px/.8 "Barlow Condensed"}
.detail-sub{margin-top:4px;color:var(--m);font-size:5px;font-weight:900;letter-spacing:1px}
.running,.line-table,.pitch-table{overflow:hidden;border:1px solid var(--l);border-radius:15px;background:#091a31}
.running{overflow-x:auto}
.running table{width:100%;min-width:480px;border-collapse:collapse;table-layout:fixed}
.running th,.running td{height:32px;border-bottom:1px solid var(--l);padding:0 5px;text-align:center;font:900 8px "Barlow Condensed"}
.running th{background:#07172d;color:#617995;font-size:5px}
.running th:first-child,.running td:first-child{width:38px;text-align:left}
.running tr:last-child td{border:0}
.line-table table,.pitch-table table{width:100%;border-collapse:collapse;table-layout:fixed}
.line-table th,.line-table td,.pitch-table th,.pitch-table td{border-bottom:1px solid var(--l)}
.line-table th,.pitch-table th{height:34px;padding:0 7px;background:#07172d;color:#607995;font-size:5px;font-weight:900;text-align:right}
.line-table th:first-child,.line-table td:first-child,.pitch-table th:first-child,.pitch-table td:first-child{width:29px;text-align:center}
.line-table th:nth-child(2),.line-table td:nth-child(2),.pitch-table th:nth-child(2),.pitch-table td:nth-child(2){text-align:left}
.line-table td{height:46px;padding:0 7px;font:900 10px "Barlow Condensed"}
.line-table .num-order,.pitch-table .order{font-size:15px;color:#7086a2}
.line-table .player-name{font-size:12px}
.line-table .position,.pitch-table .pitch-sub{display:block;margin-top:3px;color:#7187a3;font:900 4px Inter}
.line-table .sub-player{background:#07182e}
.line-table .sub-player td{height:42px}
.line-table .sub-player .num-order{color:#4d6682;font-size:12px}
.line-table .sub-player .player-name{font-size:11px;color:#d3dce7}
.line-table .sub-player .player-name:before{content:"↳ ";color:#607995}
.pitch-table td{height:51px;padding:0 8px;text-align:right;font:900 9px "Barlow Condensed"}
.pitch-table .pitcher{font-size:12px;text-align:left}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.summary-box{min-height:78px;padding:13px;border:1px solid var(--l);border-radius:13px;background:#0b1d36}
.summary-label{display:block;color:#617995;font-size:5px;font-weight:900;letter-spacing:.8px}
.summary-main{display:block;margin-top:8px;font:900 20px/.85 "Barlow Condensed"}
.summary-sub{display:block;margin-top:5px;color:#8094ac;font-size:5px;font-weight:900}

/* PLAYERS */
.players-hero{position:relative;margin:0 0 18px;padding:22px 18px 19px;overflow:hidden;border:1px solid #294766;border-radius:20px;background:linear-gradient(135deg,#102b4a,#08182e 70%);box-shadow:0 15px 35px #0003}
.players-hero:before{content:"";position:absolute;right:-65px;top:-90px;width:210px;height:210px;border:30px solid #e3183712;border-radius:50%}
.players-hero>*{position:relative;z-index:2}
.players-hero-top{display:flex;align-items:center;justify-content:space-between}
.players-kicker{font-size:5px;font-weight:900;letter-spacing:2px;color:#8095ae}
.players-count{text-align:right}
.players-count b{display:block;font:900 27px/.7 "Barlow Condensed"}
.players-count span{display:block;margin-top:5px;color:#7187a3;font-size:4px;font-weight:900;letter-spacing:1px}
.players-hero h1{margin-top:9px;font-size:46px}
.players-hero-sub{margin-top:8px;color:#879bb2;font-size:6px;font-weight:900;letter-spacing:.6px}
.player-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.player-filter{position:relative}
.player-filter label{display:block;margin:0 3px 6px;color:#607995;font-size:5px;font-weight:900;letter-spacing:1px}
.player-filter select{appearance:none;width:100%;height:37px;padding:0 28px 0 11px;outline:0;border:1px solid #203b58;border-radius:9px;background:#091a31;color:#dce4ed;font-size:5px;font-weight:900}
.player-filter:after{content:"⌄";position:absolute;right:11px;bottom:10px;color:#7087a2;pointer-events:none}
.players-summary{display:flex;align-items:center;justify-content:space-between;margin:0 3px 16px;color:#607995;font-size:5px;font-weight:900;letter-spacing:1px}
.players-summary strong{color:#e3eaf2;font-size:6px}
.player-group{margin-top:28px}
.player-group:first-child{margin-top:0}
.player-group-head{display:flex;align-items:center;gap:10px;margin:0 3px 10px}
.player-group-head b{font:900 25px/.8 "Barlow Condensed"}
.player-group-head span{color:#607995;font-size:5px;font-weight:900}
.player-group-head i{height:1px;flex:1;background:linear-gradient(90deg,#29445f,transparent)}
.player-list{display:grid;gap:7px}
.player-wrap{position:relative}
.player-card{position:relative;display:flex;align-items:center;min-height:84px;padding:11px 13px 11px 16px;overflow:hidden;border:1px solid #1d3956;border-radius:15px;background:linear-gradient(145deg,#102945,#091a31);box-shadow:0 7px 18px #0002;transition:.2s}
.player-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.player-card.active:before{background:var(--r)}
.player-card.il:before{background:#f0c928}
.player-card.man40:before{background:#777d85}
.player-card.active{--accent:#e31837}
.player-card.il{--accent:#f0c928}
.player-card.man40{--accent:#777d85}
.player-card.open{border-color:var(--accent);border-radius:15px 15px 7px 7px}
.player-number{width:42px;flex:none;color:#526f8e;font:900 29px/.72 "Barlow Condensed";letter-spacing:-1px}
.player-info{min-width:0;flex:1}
.player-name{display:block;font:900 18px/.9 "Barlow Condensed";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-role{display:flex;align-items:center;gap:6px;margin-top:7px}
.player-bt{color:#667f9b;font-size:5px;font-weight:900}
.player-roster{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:4px;font-size:4px;font-weight:900;letter-spacing:.4px}
.player-roster.active{background:#431522;color:#ff7186}
.player-roster.il{background:#4b4319;color:#f3d765}
.player-roster.man40{background:#30353a;color:#b5bbc2}
.player-position-large{flex:0 0 auto;width:auto;min-width:37px;max-width:46px;margin-left:6px;text-align:right;color:#f2f5f8;font:900 24px/.72 "Barlow Condensed";letter-spacing:-.4px;white-space:nowrap}
.player-position-label{display:block;margin-top:5px;color:#607995;font-size:4px;font-weight:900;letter-spacing:.8px}
.player-stats{margin-top:2px;padding:12px 9px 11px;border:1px solid #294762;border-top:0;border-radius:0 0 15px 15px;background:linear-gradient(160deg,#0d223d,#07172d);box-shadow:0 13px 25px #0003}
.player-profile{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:0 2px 11px;border-bottom:1px solid var(--l)}
.player-profile-name{font:900 21px/.82 "Barlow Condensed"}
.player-profile-role{margin-top:5px;color:#7187a3;font-size:5px;font-weight:900;letter-spacing:.4px}
.player-profile-number{text-align:right}
.player-profile-number b{display:block;font:900 25px/.7 "Barlow Condensed";color:#e4ebf3}
.player-profile-number span{display:block;margin-top:4px;color:#607995;font-size:4px;font-weight:900}
.player-bio{display:grid;grid-template-columns:1.3fr 1.2fr .6fr;gap:5px;margin:9px 0}
.player-bio-item{min-width:0;padding:7px 6px;border:1px solid #1e3a56;border-radius:8px;background:#0a1b32}
.player-bio-item small{display:block;color:#607995;font-size:4px;font-weight:900;letter-spacing:.4px}
.player-bio-item b{display:block;margin-top:5px;color:#e1e8f0;font:900 8px/.9 "Barlow Condensed";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-caption{display:flex;align-items:center;gap:7px;margin:3px 2px 7px}
.stat-caption b{font:900 13px/.8 "Barlow Condensed"}
.stat-caption span{color:#607995;font-size:4px;font-weight:900;letter-spacing:.8px}
.stat-caption i{height:1px;flex:1;background:#1c3652}
.player-stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.player-stat{min-width:0;padding:8px 2px 7px;border:1px solid #1d3956;border-radius:8px;background:#0a1b32;text-align:center}
.player-stat small{display:block;color:#607995;font-size:4px;font-weight:900;letter-spacing:.4px;white-space:nowrap}
.player-stat b{display:block;margin-top:5px;color:#f3f6fa;font:900 12px/.75 "Barlow Condensed";letter-spacing:-.2px;white-space:nowrap;overflow:visible}
.player-stat.war{border-color:#e3183766;background:linear-gradient(145deg,#2a1220,#171426)}
.player-stat.war small{color:#ff6c82}
.player-empty{padding:40px 15px;text-align:center;border:1px dashed #29435f;border-radius:14px;color:#607995;font-size:6px;font-weight:900;letter-spacing:1px}
.bottom-nav{position:fixed;z-index:40;left:50%;bottom:0;width:100%;max-width:560px;height:91px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#07162bed;border-top:1px solid #203b5a;backdrop-filter:blur(22px)}
.nav-inner{height:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px;border:1px solid #18324f;border-radius:17px;background:#08182e;box-shadow:0 8px 30px #00035}
.nav-item{position:relative;border:0;border-radius:12px;background:transparent;color:#617994;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:5px;font-weight:900;letter-spacing:.8px;transition:.18s}
.nav-item:active{transform:scale(.96)}
.nav-item.active{background:linear-gradient(145deg,#142b49,#0d213a);color:#fff;box-shadow:inset 0 0 0 1px #294866,0 4px 12px #0003}
.nav-item.active:before{content:"";position:absolute;top:0;left:28%;right:28%;height:2px;border-radius:0 0 5px 5px;background:var(--r);box-shadow:0 0 9px #e3183766}
.nav-icon{position:relative;width:28px;height:27px;color:currentColor}
.nav-item.active .nav-icon{color:var(--r);filter:drop-shadow(0 0 5px #e3183745)}
.schedule-icon:before{content:"";position:absolute;left:3px;top:5px;width:22px;height:19px;border:1.6px solid currentColor;border-radius:5px}
.schedule-icon:after{content:"";position:absolute;left:7px;top:2px;width:2px;height:6px;background:currentColor;border-radius:2px;box-shadow:12px 0 currentColor}
.schedule-icon{background:linear-gradient(currentColor,currentColor) 7px 12px/14px 1.5px no-repeat,linear-gradient(currentColor,currentColor) 7px 17px/10px 1.5px no-repeat}
.home-icon:before{content:"";position:absolute;left:4px;top:9px;width:20px;height:16px;border:1.6px solid currentColor;border-top:0;border-radius:3px}
.home-icon:after{content:"";position:absolute;left:7px;top:3px;width:18px;height:18px;border-left:1.6px solid currentColor;border-top:1.6px solid currentColor;transform:rotate(45deg) scale(.72);border-radius:2px}
.home-icon{background:linear-gradient(currentColor,currentColor) 13px 17px/4px 8px no-repeat}
.players-icon:before{content:"";position:absolute;left:8px;top:2px;width:11px;height:11px;border:1.6px solid currentColor;border-radius:50%}
.players-icon:after{content:"";position:absolute;left:3px;bottom:2px;width:22px;height:12px;border:1.6px solid currentColor;border-radius:13px 13px 5px 5px}
.players-icon{background:linear-gradient(currentColor,currentColor) 13px 15px/2px 6px no-repeat}
@media(max-width:390px){.players-hero h1{font-size:44px}.player-number{width:39px;font-size:27px}.player-name{font-size:17px}.player-position-large{min-width:35px;max-width:43px;font-size:22px}.player-stat b{font-size:11px}}
@media(max-width:340px){.player-stat-grid{grid-template-columns:repeat(2,1fr)}.player-filters{grid-template-columns:1fr}.player-position-large{min-width:33px;max-width:40px;font-size:20px}.player-number{width:36px;font-size:25px}.player-name{font-size:16px}}
</style>
</head>
<body>
<div class="app">

<header>
<img class="header-logo" src="https://raw.githubusercontent.com/13philly/Philly/main/IMG_7708.png" alt="">
<div class="header-detail"><b></b><i></i></div>
</header>

<main id="home" class="page show">

'"':"&quot;",

function ageHours(d){
return Math.max(0,(Date.now()-new Date(d).getTime())/3600000);

function relativeTime(d){
const h=ageHours(d);
if(h<1)return Math.max(1,Math.floor(h*60))+"M";
if(h<24)return Math.floor(h)+"H";
return Math.floor(h/24)+"D";
}

function dateText(d){

return new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit"}).format(new Date(d));

function translateTitle(title){
let s=String(title||"").replace(/&amp;/g,"&").trim();

phraseJP.forEach(([r,v])=>s=s.replace(r,v));

s=s.replace(/\s+/g," ").trim();
s=s.replace(/\s+([、。])/g,"$1");

if(!/[ぁ-んァ-ヶ一-龯]/.test(s))return "日本語訳："+String(title||"");
return s;
}

function renderNews(){

});

return`

/* SCHEDULE FROM fetch-mlb-data.json */

function normalizeGames(data){
const out=[];

Object.entries(data||{}).forEach(([pk,g])=>{
if(!g||g.s!==2026)return;

const score=Array.isArray(g.score)?g.score:[null,null];

out.push({
pk,
date:g.time||g.d,
day:g.d,
venue:g.v||"",
opp:g.opp||"OPP",
home:g.ha!=="A",
phiScore:score[0],
oppScore:score[1],
status:g.r?"FINAL":"SCHEDULED",
result:g.r||"",
innings:g.innings||[],
bat:g.bat||[],
pit:g.pit||[]
});
});

return out.sort((a,b)=>new Date(a.date)-new Date(b.date));
}

function scheduleClass(g){
const today=localDate(g.date);
const now=localDate(new Date());

let c=g.status==="FINAL"?(g.result==="W"?"win":"loss"):"next";

if(today===now)c+=" today";

return c;
}

function changeMonth(v){
monthCursor+=v;

if(monthCursor<0){
monthCursor=11;
monthYear--;
}

if(monthCursor>11){
monthCursor=0;
monthYear++;
}

renderSchedule();
}

function renderSchedule(){
$("monthLabel").textContent=
new Intl.DateTimeFormat("en-US",{month:"long"})
.format(new Date(monthYear,monthCursor,1))
.toUpperCase();

const f=$("scheduleFilter").value;
const now=localDate(new Date());

const a=schedule.filter(g=>{
const d=new Date(g.date);

let type;

if(g.status==="FINAL")type="PAST";
else if(localDate(g.date)===now)type="TODAY";
else type="UPCOMING";

return d.getFullYear()===monthYear&&
d.getMonth()===monthCursor&&
(f==="ALL"||f===type);
});

if(!a.length){
$("scheduleList").innerHTML=
'<div class="schedule-loading">NO GAMES IN THIS MONTH</div>';
return;
}

const groups={};

a.forEach(g=>{
const k=g.day;
(groups[k]??=[]).push(g);
});

$("scheduleList").innerHTML=Object.entries(groups).map(([d,arr])=>`
<section class="schedule-day">
<div class="schedule-date">
<b>${new Intl.DateTimeFormat("en-US",{weekday:"short",month:"short",day:"numeric"}).format(new Date(arr[0].date))}</b>
<span>${escapeHTML(arr[0].venue)}</span>
<i></i>
</div>

${arr.map(g=>`
<article class="schedule-game ${scheduleClass(g)}" onclick="game('${escapeHTML(g.pk)}')">

<div class="schedule-top">
<span>${g.home?"HOME":"AWAY"} · ${clock(g.date)}</span>
<span class="schedule-status">${g.status==="FINAL"?g.result:"SCHEDULED"}</span>

<small>Philadelphia Phillies</small>
</div>

<div class="schedule-score">
${g.status==="FINAL"?`${g.phiScore??0}–${g.oppScore??0}`:"VS"}
<small>${g.status==="FINAL"?"FINAL":""}</small>
</div>

<div class="schedule-team">
<b>${escapeHTML(g.opp.slice(0,3).toUpperCase())}</b>
<small>${escapeHTML(g.opp)}</small>
</div>

</div>

<div class="schedule-meta">
<span>${escapeHTML(g.venue)}</span>
<span>${g.status==="FINAL"?"OPEN GAME CENTER":"SCHEDULED"}</span>
</div>

</article>
`).join("")}
</section>
`).join("");
}

<span class="summary-label">PHILLIES HITS</span>
<span class="summary-main">${bat.reduce((a,p)=>a+(+p.H||0),0)}</span>
<span class="summary-sub">H</span>
</div>

<div class="summary-box">
<span class="summary-label">PHILLIES HOME RUNS</span>
<span class="summary-main">${bat.reduce((a,p)=>a+(+p.HR||0),0)}</span>
<span class="summary-sub">HR</span>
</div>

</div>

</div>
`);
}

/* PLAYERS */

const groups=["PITCHERS","CATCHERS","INFIELDERS","OUTFIELDERS","DH"];

const groupNames={
PITCHERS:"PITCHERS",
CATCHERS:"CATCHERS",
INFIELDERS:"INFIELDERS",
OUTFIELDERS:"OUTFIELDERS",
DH:"DESIGNATED HITTERS"
};

function rosterState(p){
const s=(p.roster?.status?.description||"").toLowerCase();
const code=p.roster?.status?.code||"";

if(code==="A"||s==="active")return"ACTIVE";
if(s.includes("injured")||s.includes("disabled"))return"IL";
return"40-MAN";
}

function positionGroup(p){
const a=(p.position?.abbreviation||"").toUpperCase();
const n=(p.position?.name||"").toLowerCase();

if(a==="DH"||n.includes("designated hitter"))return"DH";
if(n.includes("pitch")||a==="P")return"PITCHERS";
if(n.includes("catch")||a==="C")return"CATCHERS";

if(
["1B","2B","3B","SS"].includes(a)||
n.includes("base")||
n.includes("shortstop")||
n.includes("infielder")
)return"INFIELDERS";

return"OUTFIELDERS";
}

function normalizePlayer(p){
const state=rosterState(p);

return{
raw:p,
id:p.id,
name:p.name||"",
number:p.number||"",
position:p.position?.abbreviation||"",
detailPosition:p.position?.name||"",
bt:p.bt?`${p.bt.bats}/${p.bt.throws}`:"",
birthCountry:p.physical?.birthCountry||"—",
birthDate:p.physical?.birthDate||"—",
active:state==="ACTIVE",
il:state==="IL",
roster:state,
group:positionGroup(p),
type:p.stats?.type||""
};
}

function fmtDate(v){
if(!v||v==="—")return"—";

const d=new Date(v+"T00:00:00");

return isNaN(d)?"—":
d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
}

function calcAge(v){
if(!v)return"—";

const d=new Date(v+"T00:00:00");
const now=new Date();

let a=now.getFullYear()-d.getFullYear();

if(
now.getMonth()<d.getMonth()||
(now.getMonth()===d.getMonth()&&now.getDate()<d.getDate())
)a--;

return a;
}

function statValue(v,d=2){
if(v===null||v===undefined||v==="")return"—";
if(typeof v==="number"){
if(v===0)return"0";
return Math.abs(v)>=10?v.toFixed(1):v.toFixed(d);
}
return v;
}

function statsFor(p){
const s=p.raw.stats||{};
const h=s.hitting?.season;
const hs=s.hitting?.sabermetrics;
const q=s.pitching?.season;
const qs=s.pitching?.sabermetrics;

if(p.type==="pitcher"){
return[
["G",q?.gamesPlayed],
["IP",q?.inningsPitched],
["W-L",q?`${q.wins}-${q.losses}`:"—"],
["ERA",q?.era],
["WAR",qs?.war],
["FIP",qs?.fip],
["xFIP",qs?.xfip],
["WHIP",q?.whip]
];
}

return[
["G",h?.gamesPlayed],
["AVG",h?.avg],
["HR",h?.homeRuns],
["RBI",h?.rbi],
["WAR",hs?.war],
["OPS",h?.ops],
["wOBA",hs?.woba],
["BABIP",h?.babip]
];
}

function detailCard(p){
const stats=statsFor(p);
const role=p.type==="pitcher"?"PITCHER":
p.position==="DH"?"DESIGNATED HITTER":"POSITION PLAYER";

return`
<div class="player-stats">

<div class="player-profile">
<div>
<div class="player-profile-name">${escapeHTML(p.name)}</div>
<div class="player-profile-role">
${role} · ${escapeHTML(p.detailPosition)} · ${escapeHTML(p.bt)}
</div>
</div>

<div class="player-profile-number">
<b>${escapeHTML(p.number)}</b>
<span>ROSTER NUMBER</span>
</div>
</div>

<div class="player-bio">

<div class="player-bio-item">
<small>BIRTH COUNTRY</small>
<b>${escapeHTML(p.birthCountry)}</b>
</div>

<div class="player-bio-item">
<small>BIRTH DATE</small>
<b>${escapeHTML(fmtDate(p.birthDate))}</b>
</div>

<div class="player-bio-item">
<small>AGE</small>
<b>${calcAge(p.birthDate)}</b>
</div>

</div>

<div class="stat-caption">
<b>SEASON</b>
<span>${p.type==="pitcher"?"PITCHING":"BATTING"}</span>
<i></i>
</div>

<div class="player-stat-grid">

${stats.map(([label,value])=>`
<div class="player-stat ${label==="WAR"?"war":""}">
<small>${label}</small>
<b>${statValue(value)}</b>
</div>
`).join("")}

</div>

</div>
`;
}

function togglePlayer(i){
opened=opened===i?null:i;
renderPlayers();

if(opened!==null){
setTimeout(()=>{
const e=$("player-"+opened);
if(e)e.scrollIntoView({behavior:"smooth",block:"nearest"});
},40);
}
}

function renderPlayers(){
const pos=$("positionFilter").value;
const rf=$("rosterFilter").value;

const list=rosterData
.filter(p=>
(rf==="ALL"||p.roster===rf)&&
(pos==="ALL"||p.group===pos)
)
.sort((a,b)=>(+a.number||999)-(+b.number||999));

$("heroCount").textContent=list.length;
$("playerCount").textContent=list.length+" PLAYERS";

const gs=pos==="ALL"?groups:[pos];

$("playerList").innerHTML=gs.map(g=>{
const a=list.filter(p=>p.group===g);

if(!a.length)return"";

return`
<section class="player-group">

<div class="player-group-head">
<b>${groupNames[g]}</b>
<span>${a.length}</span>
<i></i>
</div>

<div class="player-list">

${a.map(p=>{
const i=rosterData.indexOf(p);
const c=p.il?"il":p.active?"active":"man40";
const open=opened===i;

return`
<div class="player-wrap" id="player-${i}">

<div class="player-card ${c} ${open?"open":""}" onclick="togglePlayer(${i})">

<div class="player-number">${escapeHTML(p.number)}</div>

<div class="player-info">
<span class="player-name">${escapeHTML(p.name)}</span>

<div class="player-role">
<span class="player-bt">${escapeHTML(p.bt)}</span>
<span class="player-roster ${c}">${p.roster}</span>
</div>
</div>

<div class="player-position-large">
${escapeHTML(p.position)}
<span class="player-position-label">POSITION</span>
</div>

</div>

${open?detailCard(p):""}

</div>
`;
}).join("")}

</div>
</section>
`;
}).join("")||`
<div class="player-empty">
NO PLAYERS MATCH THE CURRENT FILTER
</div>
`;
}

/* LOAD ALL LOCAL DATA */

async function load(){

try{

const saved=JSON.parse(localStorage.getItem("philly-news-read")||"[]");

const [n,s,p,g]=await Promise.all([
fetch(FILES.news,{cache:"no-store"}).then(r=>r.json()),
fetch(FILES.standings,{cache:"no-store"}).then(r=>r.json()),
fetch(FILES.players,{cache:"no-store"}).then(r=>r.json()),
fetch(FILES.games,{cache:"no-store"}).then(r=>r.json())
]);

news=(n||[]).map(x=>({
...x,
read:saved.includes(x.link),
saved:false
}));

standings=s?.division?.teams||[];

rosterData=(p?.players||[])
.map(normalizePlayer)
.filter(x=>x.active||x.il||x.raw.roster?.fortyMan);

games=g||{};
schedule=normalizeGames(games);

renderNews();
renderStandings();
renderPlayers();
renderSchedule();
renderHomeGame();

}catch(e){

console.error(e);

$("news").innerHTML=
'<div class="schedule-loading">DATA UNAVAILABLE</div>';

$("scheduleList").innerHTML=
'<div class="schedule-loading">DATA UNAVAILABLE</div>';
}
}

/* HOME */

function renderHomeGame(){

const today=localDate(new Date());

let g=schedule.find(x=>localDate(x.date)===today);

if(!g)g=schedule.filter(x=>x.status==="FINAL").at(-1);

if(!g){
$("homeLive").innerHTML=
'<div class="card"><div class="schedule-loading">NO GAME DATA</div></div>';
return;
}

const live=false;

$("homeGameLabel").textContent=
g.status==="FINAL"?"LATEST RESULT":"GAME DAY";

$("homeLive").innerHTML=`
<div class="card live-card">

<div class="game-head">
<div>${g.status==="FINAL"?"FINAL":"UPCOMING"}</div>
<div class="game-state">${dateText(g.date)}</div>
</div>

<div class="score">

<span class="team">PHI</span>

<strong>
${g.status==="FINAL"
?`${g.phiScore??0}–${g.oppScore??0}`
:"VS"}
</strong>

<span class="team">
${escapeHTML(g.opp.slice(0,3).toUpperCase())}
</span>

</div>

<div class="game-foot">
<span>${escapeHTML(g.venue)}</span>
<span>${g.status==="FINAL"?g.result:clock(g.date)}</span>
</div>

<button class="game-btn" onclick="game('${escapeHTML(g.pk)}')">
OPEN GAME CENTER
</button>

</div>
`;
}

load();
</script>
