<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e31837">
<title>Phillies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#061225;--c:#0b1b32;--c2:#0e2441;--l:#193553;--r:#e31837;--w:#f5f7fb;--m:#7187a3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--w);font-family:Inter,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 50% -8%,#193b67,#0a1a32 34%,#061225 70%)}
button,select{font:inherit;cursor:pointer}
.app{max-width:560px;min-height:100vh;margin:auto;padding-bottom:106px}
header{position:sticky;top:0;z-index:30;height:76px;display:flex;align-items:center;padding:0 16px;overflow:hidden;background:linear-gradient(112deg,#b90e2c,#e31837 56%,#b40d2a);box-shadow:0 8px 25px #0005}
header:before{content:"";position:absolute;inset:0 auto 0;width:65%;background:linear-gradient(115deg,transparent,#ffffff13 45%,transparent 46%);transform:skewX(-18deg)}
header:after{content:"";position:absolute;right:-45px;top:-75px;width:210px;height:210px;border:27px solid #ffffff0d;border-radius:50%}
.header-logo{position:relative;z-index:2;height:51px;width:auto;max-width:205px;object-fit:contain;filter:drop-shadow(0 4px 8px #0005)}
.header-detail{position:absolute;z-index:2;right:16px;bottom:13px;width:72px}
.header-detail b{display:block;height:2px;background:#fff9}.header-detail i{display:block;width:25px;height:2px;margin-top:4px;background:#ffffff45}
.page{display:none;padding:22px 15px}.page.show{display:block}
.eyebrow{font-size:6px;font-weight:900;color:var(--m);letter-spacing:1.6px;margin-bottom:5px}
h1{margin:0;font:900 46px/.82 "Barlow Condensed"}
.section{display:flex;align-items:end;justify-content:space-between;margin:27px 2px 10px}
.section>b{font:900 19px/.8 "Barlow Condensed"}.section>span{font-size:5px;color:var(--m);font-weight:900;letter-spacing:1px}
.card{border:1px solid var(--l);border-radius:17px;background:linear-gradient(145deg,var(--c2),var(--c));box-shadow:0 12px 28px #00025}
.live-card{position:relative;overflow:hidden}.live-card:before{content:"";position:absolute;right:-70px;top:-85px;width:205px;height:205px;border-radius:50%;border:32px solid #e3183714}
.game-head,.game-foot{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:13px 15px}
.game-head{border-bottom:1px solid var(--l)}.live{display:flex;align-items:center;gap:7px;color:#ff647d;font-size:6px;font-weight:900;letter-spacing:1px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--r);box-shadow:0 0 0 5px #e3183720}
.game-state,.game-foot{font-size:5px;color:var(--m);font-weight:900}
.score{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:15px;padding:34px 15px 29px}
.score strong{font:900 58px/.75 "Barlow Condensed"}.score .team{font:900 29px/.8 "Barlow Condensed"}
.game-foot{border-top:1px solid var(--l);letter-spacing:.6px}
.game-btn{position:relative;z-index:2;margin:0 15px 15px;width:calc(100% - 30px);padding:11px;border:1px solid #ff5268;background:#d91534;border-radius:8px;color:#fff;font-size:6px;font-weight:900;letter-spacing:.8px}
.latest-head{display:flex;align-items:center;justify-content:space-between;gap:7px}.latest-head>b{font:900 19px/.8 "Barlow Condensed"}
.news-tools{display:flex;gap:5px}.news-select{position:relative}
.news-select select{appearance:none;outline:0;height:29px;min-width:67px;padding:0 21px 0 8px;border:1px solid var(--l);border-radius:7px;background:#0a1b34;color:#dce4ed;font-size:5px;font-weight:900}
.news-select:after{content:"⌄";position:absolute;right:7px;top:50%;transform:translateY(-55%);color:#7087a2;pointer-events:none}
.news-grid{display:grid;gap:10px}
.news{position:relative;padding:14px 13px 12px;border:1px solid var(--l);border-radius:14px;background:linear-gradient(145deg,#0d213b,#09192f);box-shadow:0 7px 18px #00022;cursor:pointer}
.news:active{transform:scale(.988)}
.news.unread{border-color:#29415c}
.news.unread:before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--r)}
.news.unread:after{content:"";position:absolute;right:13px;top:15px;width:5px;height:5px;border-radius:50%;background:var(--r)}
.nmeta{display:flex;align-items:center;gap:6px;margin-bottom:7px}.source{font-size:5px;color:#ff6078;font-weight:900}.dot{width:3px;height:3px;border-radius:50%;background:#526b88}
.time,.published,.read{font-size:5px;color:#627995}.nt{font:800 18px/1.07 "Barlow Condensed"}.nj{margin-top:6px;color:#9caec2;font-size:8px;line-height:1.4}
.original{margin-top:5px;color:#506983;font-size:5px;line-height:1.35}.nbottom{display:flex;align-items:center;margin-top:11px}
.published{margin-left:auto;margin-right:9px}.unread .read{color:#ff6078}
.save{position:relative;width:28px;height:28px;border:1px solid #29435f;border-radius:8px;background:#0a1b34;color:#7187a3}
.save:before{content:"";position:absolute;left:9px;top:7px;width:8px;height:11px;border:1.3px solid currentColor;border-radius:2px}
.save:after{content:"";position:absolute;left:11px;top:14px;width:5px;height:5px;border-left:1.3px solid currentColor;border-bottom:1.3px solid currentColor;transform:rotate(-45deg);background:#0a1b34}
.save.on{color:#ff5871;border-color:#e3183755}
.stand{overflow:hidden}.stand table{width:100%;border-collapse:collapse;table-layout:fixed}.stand th,.stand td{border-bottom:1px solid var(--l)}
.stand th{height:32px;padding:0 10px;background:#07172d;color:#617995;font-size:5px;font-weight:900;text-align:right}
.stand th:first-child,.stand td:first-child{width:38px;text-align:center}.stand th:nth-child(2),.stand td:nth-child(2){text-align:left}
.stand th:nth-child(n+3),.stand td:nth-child(n+3){width:42px;text-align:right}.stand td{height:45px;padding:0 10px;font-size:7px}
.stand tr:last-child td{border:0}.rank{font:900 16px "Barlow Condensed";color:var(--m)}.tn{font-weight:900}.num{font:800 11px "Barlow Condensed"}
.phi{background:#102a49}
.empty{min-height:70vh;display:flex;align-items:center;justify-content:center;color:var(--m);font:900 12px "Barlow Condensed";letter-spacing:1px}
