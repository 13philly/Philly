<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e31837">
<title>Phillies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#061225;--c:#0b1b32;--c2:#0e2441;--l:#193553;--r:#e31837;--w:#f5f7fb;--m:#7187a3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--w);font-family:Inter,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 50% -8%,#193b67,#0a1a32 34%,#061225 70%)}
button,select{font:inherit;cursor:pointer}
.app{max-width:560px;min-height:100vh;margin:auto;padding-bottom:106px}
header{position:sticky;top:0;z-index:30;height:76px;display:flex;align-items:center;padding:0 16px;overflow:hidden;background:linear-gradient(112deg,#b90e2c,#e31837 56%,#b40d2a);box-shadow:0 8px 25px #0005}
header:before{content:"";position:absolute;inset:0 auto 0;width:65%;background:linear-gradient(115deg,transparent,#ffffff13 45%,transparent 46%);transform:skewX(-18deg)}
header:after{content:"";position:absolute;right:-45px;top:-75px;width:210px;height:210px;border:27px solid #ffffff0d;border-radius:50%}
.header-logo{position:relative;z-index:2;height:51px;width:auto;max-width:205px;object-fit:contain;filter:drop-shadow(0 4px 8px #0005)}
.header-detail{position:absolute;z-index:2;right:16px;bottom:13px;width:72px}
.header-detail b{display:block;height:2px;background:#fff9}.header-detail i{display:block;width:25px;height:2px;margin-top:4px;background:#ffffff45}
.page{display:none;padding:22px 15px}.page.show{display:block}
.eyebrow{font-size:6px;font-weight:900;color:var(--m);letter-spacing:1.6px;margin-bottom:5px}
h1{margin:0;font:900 46px/.82 "Barlow Condensed"}
.section{display:flex;align-items:end;justify-content:space-between;margin:27px 2px 10px}
.section>b{font:900 19px/.8 "Barlow Condensed"}.section>span{font-size:5px;color:var(--m);font-weight:900;letter-spacing:1px}
.card{border:1px solid var(--l);border-radius:17px;background:linear-gradient(145deg,var(--c2),var(--c));box-shadow:0 12px 28px #00025}
.live-card{position:relative;overflow:hidden}.live-card:before{content:"";position:absolute;right:-70px;top:-85px;width:205px;height:205px;border-radius:50%;border:32px solid #e3183714}
.game-head,.game-foot{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:13px 15px}
.game-head{border-bottom:1px solid var(--l)}.live{display:flex;align-items:center;gap:7px;color:#ff647d;font-size:6px;font-weight:900;letter-spacing:1px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--r);box-shadow:0 0 0 5px #e3183720}
.game-state,.game-foot{font-size:5px;color:var(--m);font-weight:900}
.score{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:15px;padding:34px 15px 29px}
.score strong{font:900 58px/.75 "Barlow Condensed"}.score .team{font:900 29px/.8 "Barlow Condensed"}
.game-foot{border-top:1px solid var(--l);letter-spacing:.6px}
.game-btn{position:relative;z-index:2;margin:0 15px 15px;width:calc(100% - 30px);padding:11px;border:1px solid #ff5268;background:#d91534;border-radius:8px;color:#fff;font-size:6px;font-weight:900;letter-spacing:.8px}
.latest-head{display:flex;align-items:center;justify-content:space-between;gap:7px}.latest-head>b{font:900 19px/.8 "Barlow Condensed"}
.news-tools{display:flex;gap:5px}.news-select{position:relative}
.news-select select{appearance:none;outline:0;height:29px;min-width:67px;padding:0 21px 0 8px;border:1px solid var(--l);border-radius:7px;background:#0a1b34;color:#dce4ed;font-size:5px;font-weight:900}
.news-select:after{content:"⌄";position:absolute;right:7px;top:50%;transform:translateY(-55%);color:#7087a2;pointer-events:none}
.news-grid{display:grid;gap:10px}
.news{position:relative;padding:14px 13px 12px;border:1px solid var(--l);border-radius:14px;background:linear-gradient(145deg,#0d213b,#09192f);box-shadow:0 7px 18px #00022}
.news:active{transform:scale(.988)}.news.unread{border-color:#29415c}
.news.unread:before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--r)}
.news.unread:after{content:"";position:absolute;right:13px;top:15px;width:5px;height:5px;border-radius:50%;background:var(--r)}
.nmeta{display:flex;align-items:center;gap:6px;margin-bottom:7px}.source{font-size:5px;color:#ff6078;font-weight:900}.dot{width:3px;height:3px;border-radius:50%;background:#526b88}
.time,.published,.read{font-size:5px;color:#627995}.nt{font:800 18px/1.07 "Barlow Condensed"}.nj{margin-top:6px;color:#9caec2;font-size:8px;line-height:1.4}
.nbottom{display:flex;align-items:center;margin-top:11px}.published{margin-left:auto;margin-right:9px}.unread .read{color:#ff6078}
.save{position:relative;width:28px;height:28px;border:1px solid #29435f;border-radius:8px;background:#0a1b34;color:#7187a3}
.save:before{content:"";position:absolute;left:9px;top:7px;width:8px;height:11px;border:1.3px solid currentColor;border-radius:2px}
.save:after{content:"";position:absolute;left:11px;top:14px;width:5px;height:5px;border-left:1.3px solid currentColor;border-bottom:1.3px solid currentColor;transform:rotate(-45deg);background:#0a1b34}
.save.on{color:#ff5871;border-color:#e3183755}
.stand{overflow:hidden}.stand table{width:100%;border-collapse:collapse;table-layout:fixed}.stand th,.stand td{border-bottom:1px solid var(--l)}
.stand th{height:32px;padding:0 10px;background:#07172d;color:#617995;font-size:5px;font-weight:900;text-align:right}
.stand th:first-child,.stand td:first-child{width:38px;text-align:center}.stand th:nth-child(2),.stand td:nth-child(2){text-align:left}
.stand th:nth-child(n+3),.stand td:nth-child(n+3){width:42px;text-align:right}.stand td{height:45px;padding:0 10px;font-size:7px}
.stand tr:last-child td{border:0}.rank{font:900 16px "Barlow Condensed";color:var(--m)}.tn{font-weight:900}.num{font:800 11px "Barlow Condensed"}
.phi{background:#102a49}
.empty{min-height:70vh;display:flex;align-items:center;justify-content:center;color:var(--m);font:900 12px "Barlow Condensed";letter-spacing:1px}

/* SCHEDULE */
.schedule-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:17px}.schedule-head h1{font-size:52px}
.schedule-tools{display:flex;gap:5px}.schedule-tools select{appearance:none;height:31px;padding:0 21px 0 8px;border:1px solid var(--l);border-radius:7px;background:#0a1b34;color:#dce4ed;font-size:5px;font-weight:900}
.schedule-list{display:grid;gap:9px}.schedule-day{margin-top:18px}.schedule-day:first-child{margin-top:0}
.schedule-date{display:flex;align-items:center;gap:8px;margin:0 3px 7px}.schedule-date b{font:900 17px/.8 "Barlow Condensed"}.schedule-date span{color:#607995;font-size:5px;font-weight:900}.schedule-date i{height:1px;flex:1;background:linear-gradient(90deg,#29445f,transparent)}
.schedule-game{position:relative;padding:13px;border:1px solid var(--l);border-radius:15px;background:linear-gradient(145deg,#0d213b,#09192f);box-shadow:0 7px 18px #00022;overflow:hidden}
.schedule-game.today{border-color:#e3183759}.schedule-game.win{border-left:3px solid #5bbf84}.schedule-game.loss{border-left:3px solid #e05d72}.schedule-game.next{border-left:3px solid #6e8cab}
.schedule-top{display:flex;justify-content:space-between;align-items:center;color:#607995;font-size:5px;font-weight:900}.schedule-status{color:#ff6178}
.schedule-teams{display:grid;grid-template-columns:1fr 45px 1fr;align-items:center;gap:5px;margin-top:11px}.schedule-team{text-align:center}.schedule-team b{display:block;font:900 22px/.8 "Barlow Condensed"}.schedule-team small{display:block;margin-top:5px;color:#6d829b;font-size:4px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.schedule-score{text-align:center;font:900 23px/.8 "Barlow Condensed"}.schedule-score small{display:block;margin-top:5px;color:#607995;font-size:4px;font-weight:900}
.schedule-meta{display:flex;justify-content:space-between;gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid #193553;color:#637a95;font-size:4px;font-weight:900}.schedule-meta span:last-child{text-align:right}
.schedule-loading{padding:35px;text-align:center;color:#607995;font-size:6px;font-weight:900}

/* GAME CENTER */
.game-detail{padding:22px 15px 30px}.back{width:38px;height:36px;border:1px solid var(--l);border-radius:9px;background:#0b1d36;color:#fff;font-size:23px}
.detail-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}.detail-title{font:900 27px/.8 "Barlow Condensed"}.detail-sub{margin-top:4px;color:var(--m);font-size:5px;font-weight:900;letter-spacing:1px}
.running{overflow-x:auto;border:1px solid var(--l);border-radius:15px;background:#091a31}.running table{width:100%;min-width:480px;border-collapse:collapse;table-layout:fixed}
.running th,.running td{height:32px;border-bottom:1px solid var(--l);padding:0 5px;text-align:center;font:900 8px "Barlow Condensed"}
.running th{background:#07172d;color:#617995;font-size:5px}.running th:first-child,.running td:first-child{width:38px;text-align:left}
.running th:nth-child(n+2):nth-child(-n+10),.running td:nth-child(n+2):nth-child(-n+10){width:34px}.running th:nth-child(n+11),.running td:nth-child(n+11){width:38px}.running tr:last-child td{border:0}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.summary-box{min-height:78px;padding:13px;border:1px solid var(--l);border-radius:13px;background:#0b1d36}
.summary-label{display:block;color:#617995;font-size:5px;font-weight:900;letter-spacing:.8px}.summary-main{display:block;margin-top:8px;font:900 20px/.85 "Barlow Condensed"}.summary-sub{display:block;margin-top:5px;color:#8094ac;font-size:5px;font-weight:900}
.bases{display:flex;align-items:center;justify-content:center;height:46px;margin-top:6px}.base{width:13px;height:13px;border:1px solid #526b88;transform:rotate(45deg);margin:0 9px}.base.on{background:var(--r);border-color:var(--r)}
.line-table,.pitch-table{overflow:hidden;border:1px solid var(--l);border-radius:15px;background:#091a31}.line-table table,.pitch-table table{width:100%;border-collapse:collapse;table-layout:fixed}
.line-table th,.line-table td,.pitch-table th,.pitch-table td{border-bottom:1px solid var(--l)}.line-table th,.pitch-table th{height:34px;padding:0 7px;background:#07172d;color:#607995;font-size:5px;font-weight:900;text-align:right}
.line-table th:first-child,.line-table td:first-child,.pitch-table th:first-child,.pitch-table td:first-child{width:29px;text-align:center}
.line-table th:nth-child(2),.line-table td:nth-child(2),.pitch-table th:nth-child(2),.pitch-table td:nth-child(2){text-align:left}
.line-table th:nth-child(n+3),.line-table td:nth-child(n+3){width:43px;text-align:right}.line-table td{height:46px;padding:0 7px;font:900 10px "Barlow Condensed"}
.line-table tr:last-child td,.pitch-table tr:last-child td{border:0}.line-table .num-order,.pitch-table .order{font-size:15px;color:#7086a2}.line-table .player-name{font-size:12px}
.line-table .position,.pitch-table .pitch-sub{display:block;margin-top:3px;color:#7187a3;font:900 4px Inter}.line-table .sub-player{background:#07182e}.line-table .sub-player td{height:42px}
.line-table .sub-player .num-order{color:#4d6682;font-size:12px}.line-table .sub-player .player-name{font-size:11px;color:#d3dce7}.line-table .sub-player .player-name:before{content:"↳ ";color:#607995}
.pitch-table col.order{width:30px}.pitch-table col.ip{width:48px}.pitch-table col.stat{width:38px}.pitch-table th,.pitch-table td{border-bottom:1px solid var(--l)}
.pitch-table th{height:34px;padding:0 8px;background:#07172d;color:#607995;font-size:5px;font-weight:900;text-align:right}
.pitch-table th:first-child,.pitch-table td:first-child{text-align:center}.pitch-table th:nth-child(2),.pitch-table td:nth-child(2){text-align:left}
.pitch-table td{height:51px;padding:0 8px;text-align:right;font:900 9px "Barlow Condensed"}.pitch-table .pitcher{font-size:12px;text-align:left}.pitch-table .stat{font-size:9px}

/* PLAYERS */
.player-heading{margin-bottom:17px}
.player-heading h1{font-size:52px}
.player-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}.player-filter{position:relative}
.player-filter label{display:block;margin:0 3px 6px;color:#607995;font-size:5px;font-weight:900;letter-spacing:1px}
.player-filter select{appearance:none;width:100%;height:37px;padding:0 28px 0 11px;outline:0;border:1px solid #203b58;border-radius:9px;background:#091a31;color:#dce4ed;font-size:5px;font-weight:900}
.player-filter:after{content:"⌄";position:absolute;right:11px;bottom:10px;color:#7087a2;pointer-events:none}.players-summary{display:flex;align-items:center;justify-content:space-between;margin:0 3px 16px;color:#607995;font-size:5px;font-weight:900;letter-spacing:1px}
.players-summary strong{color:#e3eaf2;font-size:6px}.player-group{margin-top:28px}.player-group:first-child{margin-top:0}
.player-group-head{display:flex;align-items:center;gap:10px;margin:0 3px 10px}.player-group-head b{font:900 25px/.8 "Barlow Condensed"}.player-group-head span{color:#607995;font-size:5px;font-weight:900}.player-group-head i{height:1px;flex:1;background:linear-gradient(90deg,#29445f,transparent)}
.player-list{display:grid;gap:7px}.player-wrap{position:relative}
.player-card{position:relative;display:flex;align-items:center;min-height:84px;padding:11px 13px 11px 16px;overflow:hidden;border:1px solid #1d3956;border-radius:15px;background:linear-gradient(145deg,#102945,#091a31);box-shadow:0 7px 18px #0002;transition:.2s}
.player-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}.player-card.active:before{background:var(--r)}.player-card.il:before{background:#f0c928}.player-card.man40:before{background:#777d85}
.player-card.active{--accent:#e31837}.player-card.il{--accent:#f0c928}.player-card.man40{--accent:#777d85}.player-card.open{border-color:var(--accent);border-radius:15px 15px 7px 7px}
.player-number{width:42px;flex:none;color:#526f8e;font:900 29px/.72 "Barlow Condensed";letter-spacing:-1px}.player-info{min-width:0;flex:1}
.player-name{display:block;font:900 18px/.9 "Barlow Condensed";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-role{display:flex;align-items:center;gap:6px;margin-top:7px}
.player-bt{color:#667f9b;font-size:5px;font-weight:900}.player-roster{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:4px;font-size:4px;font-weight:900;letter-spacing:.4px}
.player-roster.active{background:#431522;color:#ff7186}.player-roster.il{background:#4b4319;color:#f3d765}.player-roster.man40{background:#30353a;color:#b5bbc2}
.player-position-large{flex:0 0 auto;width:auto;min-width:37px;max-width:46px;margin-left:6px;text-align:right;color:#f2f5f8;font:900 24px/.72 "Barlow Condensed";letter-spacing:-.4px;white-space:nowrap}
.player-position-label{display:block;margin-top:5px;color:#607995;font-size:4px;font-weight:900;letter-spacing:.8px}
.player-stats{margin-top:2px;padding:12px 9px 11px;border:1px solid #294762;border-top:0;border-radius:0 0 15px 15px;background:linear-gradient(160deg,#0d223d,#07172d);box-shadow:0 13px 25px #0003}
.player-profile{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:0 2px 11px;border-bottom:1px solid var(--l)}
.player-profile-name{font:900 21px/.82 "Barlow Condensed"}.player-profile-role{margin-top:5px;color:#7187a3;font-size:5px;font-weight:900;letter-spacing:.4px}
.player-profile-number{text-align:right}.player-profile-number b{display:block;font:900 25px/.7 "Barlow Condensed";color:#e4ebf3}.player-profile-number span{display:block;margin-top:4px;color:#607995;font-size:4px;font-weight:900}
.player-bio{display:grid;grid-template-columns:1.3fr 1.2fr .6fr;gap:5px;margin:9px 0}.player-bio-item{min-width:0;padding:7px 6px;border:1px solid #1e3a56;border-radius:8px;background:#0a1b32}
.player-bio-item small{display:block;color:#607995;font-size:4px;font-weight:900;letter-spacing:.4px}.player-bio-item b{display:block;margin-top:5px;color:#e1e8f0;font:900 8px/.9 "Barlow Condensed";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-caption{display:flex;align-items:center;gap:7px;margin:3px 2px 7px}.stat-caption b{font:900 13px/.8 "Barlow Condensed"}.stat-caption span{color:#607995;font-size:4px;font-weight:900;letter-spacing:.8px}.stat-caption i{height:1px;flex:1;background:#1c3652}
.player-stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.player-stat{min-width:0;padding:8px 2px 7px;border:1px solid #1d3956;border-radius:8px;background:#0a1b32;text-align:center}
.player-stat small{display:block;color:#607995;font-size:4px;font-weight:900;letter-spacing:.4px;white-space:nowrap}.player-stat b{display:block;margin-top:5px;color:#f3f6fa;font:900 12px/.75 "Barlow Condensed";letter-spacing:-.2px;white-space:nowrap;overflow:visible}
.player-stat.war{border-color:#e3183766;background:linear-gradient(145deg,#2a1220,#171426)}.player-stat.war small{color:#ff6c82}.player-empty{padding:40px 15px;text-align:center;border:1px dashed #29435f;border-radius:14px;color:#607995;font-size:6px;font-weight:900;letter-spacing:1px}
.bottom-nav{position:fixed;z-index:40;left:50%;bottom:0;width:100%;max-width:560px;height:91px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#07162bed;border-top:1px solid #203b5a;backdrop-filter:blur(22px)}
.nav-inner{height:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px;border:1px solid #18324f;border-radius:17px;background:#08182e;box-shadow:0 8px 30px #00035}
.nav-item{position:relative;border:0;border-radius:12px;background:transparent;color:#617994;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:5px;font-weight:900;letter-spacing:.8px;transition:.18s}
.nav-item:active{transform:scale(.96)}.nav-item.active{background:linear-gradient(145deg,#142b49,#0d213a);color:#fff;box-shadow:inset 0 0 0 1px #294866,0 4px 12px #0003}
.nav-item.active:before{content:"";position:absolute;top:0;left:28%;right:28%;height:2px;border-radius:0 0 5px 5px;background:var(--r);box-shadow:0 0 9px #e3183766}
.nav-icon{position:relative;width:28px;height:27px;color:currentColor}.nav-item.active .nav-icon{color:var(--r);filter:drop-shadow(0 0 5px #e3183745)}
.schedule-icon:before{content:"";position:absolute;left:3px;top:5px;width:22px;height:19px;border:1.6px solid currentColor;border-radius:5px}.schedule-icon:after{content:"";position:absolute;left:7px;top:2px;width:2px;height:6px;background:currentColor;border-radius:2px;box-shadow:12px 0 currentColor}
.schedule-icon{background:linear-gradient(currentColor,currentColor) 7px 12px/14px 1.5px no-repeat,linear-gradient(currentColor,currentColor) 7px 17px/10px 1.5px no-repeat}
.home-icon:before{content:"";position:absolute;left:4px;top:9px;width:20px;height:16px;border:1.6px solid currentColor;border-top:0;border-radius:3px}.home-icon:after{content:"";position:absolute;left:7px;top:3px;width:18px;height:18px;border-left:1.6px solid currentColor;border-top:1.6px solid currentColor;transform:rotate(45deg) scale(.72);border-radius:2px}
.home-icon{background:linear-gradient(currentColor,currentColor) 13px 17px/4px 8px no-repeat}.players-icon:before{content:"";position:absolute;left:8px;top:2px;width:11px;height:11px;border:1.6px solid currentColor;border-radius:50%}.players-icon:after{content:"";position:absolute;left:3px;bottom:2px;width:22px;height:12px;border:1.6px solid currentColor;border-radius:13px 13px 5px 5px}.players-icon{background:linear-gradient(currentColor,currentColor) 13px 15px/2px 6px no-repeat}
@media(max-width:390px){.player-heading h1{font-size:48px}.player-number{width:39px;font-size:27px}.player-name{font-size:17px}.player-position-large{min-width:35px;max-width:43px;font-size:22px}.player-stat b{font-size:11px}}
@media(max-width:340px){.player-stat-grid{grid-template-columns:repeat(2,1fr)}.player-filters{grid-template-columns:1fr}.player-position-large{min-width:33px;max-width:40px;font-size:20px}.player-number{width:36px;font-size:25px}.player-name{font-size:16px}}
</style>
</head>
<body>
<div class="app">

<header>
<img class="header-logo" src="https://raw.githubusercontent.com/13philly/Philly/main/IMG_7708.png" alt="">
<div class="header-detail"><b></b><i></i></div>
</header>

<main id="home" class="page show">
<div class="eyebrow">PHILADELPHIA PHILLIES</div>
<h1>HOME</h1>
<div class="section"><b>LIVE CENTER</b><span id="homeGameLabel">GAME DAY</span></div>
<div id="homeLive"></div>

<div class="section latest-head">
<b>LATEST</b>
<div class="news-tools">
<div class="news-select"><select id="newsFilter" onchange="renderNews()"><option value="1">24 HOURS</option><option value="3">3 DAYS</option><option value="7" selected>7 DAYS</option></select></div>
<div class="news-select"><select id="readFilter" onchange="renderNews()"><option value="ALL">ALL</option><option value="UNREAD">UNREAD</option><option value="READ">READ</option></select></div>
</div>
</div>
<div id="news" class="news-grid"></div>

<div class="section"><b>NL EAST</b><span>STANDINGS</span></div>
<div class="card stand">
<table>
<thead><tr><th>#</th><th>TEAM</th><th>W</th><th>L</th><th>GB</th></tr></thead>
<tbody id="standings"></tbody>
</table>
</div>
</main>

<main id="schedule" class="page">
<div class="schedule-head">
<div><div class="eyebrow">PHILADELPHIA PHILLIES</div><h1>SCHEDULE</h1></div>
<div class="schedule-tools"><select id="scheduleFilter" onchange="renderSchedule()"><option value="ALL">ALL</option><option value="PAST">PAST</option><option value="TODAY">TODAY</option><option value="UPCOMING">UPCOMING</option></select></div>
</div>
<div id="scheduleList" class="schedule-list"><div class="schedule-loading">LOADING SCHEDULE</div></div>
</main>

<main id="players" class="page">
<div class="player-heading">
<div class="eyebrow">PHILADELPHIA PHILLIES</div>
<h1>PLAYERS</h1>
</div>

<div class="player-filters">
<div class="player-filter"><label>POSITION</label><select id="positionFilter" onchange="renderPlayers()"><option value="ALL">ALL POSITIONS</option><option value="PITCHERS">PITCHERS</option><option value="CATCHERS">CATCHERS</option><option value="INFIELDERS">INFIELDERS</option><option value="OUTFIELDERS">OUTFIELDERS</option><option value="DH">DESIGNATED HITTERS</option></select></div>
<div class="player-filter"><label>ROSTER</label><select id="rosterFilter" onchange="renderPlayers()"><option value="ALL">ACTIVE + IL + 40-MAN</option><option value="ACTIVE">ACTIVE</option><option value="IL">IL</option><option value="40-MAN">40-MAN</option></select></div>
</div>

<div class="players-summary"><span>ROSTER DIRECTORY</span><strong id="playerCount">0 PLAYERS</strong></div>
<div id="playerList"></div>
</main>

<section id="detail"></section>

<nav class="bottom-nav">
<div class="nav-inner">
<button id="ns" class="nav-item" onclick="go('schedule')"><span class="nav-icon schedule-icon"></span><span>SCHEDULE</span></button>
<button id="nh" class="nav-item active" onclick="go('home')"><span class="nav-icon home-icon"></span><span>HOME</span></button>
<button id="np" class="nav-item" onclick="go('players')"><span class="nav-icon players-icon"></span><span>PLAYERS</span></button>
</div>
</nav>

</div>

<script>
const $=id=>document.getElementById(id);
const RAW="https://raw.githubusercontent.com/13philly/Philly/main/data/";
const MLB="https://statsapi.mlb.com/api/v1";
let news=[],standings=[],schedule=[],games={},rosterData=[],opened=null;

function escapeHTML(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function go(id){
["home","schedule","players"].forEach(x=>$(x).classList.toggle("show",x==id));
["h","s","p"].forEach(x=>$("n"+x).classList.toggle("active",x==={home:"h",schedule:"s",players:"p"}[id]));
$("detail").innerHTML="";
if(id=="players")renderPlayers();
if(id=="schedule")renderSchedule();
scrollTo(0,0)
}
function detail(html){["home","schedule","players"].forEach(x=>$(x).classList.remove("show"));$("detail").innerHTML=html;scrollTo(0,0)}
function closeGame(){go("home")}

function ageHours(d){return Math.max(0,(Date.now()-new Date(d).getTime())/3600000)}
function relativeTime(d){
let h=ageHours(d);
if(h<1)return Math.max(1,Math.floor(h*60))+"M";
if(h<24)return Math.floor(h)+"H";
return Math.floor(h/24)+"D"
}
function dateText(d){
return new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric",year:"numeric"}).format(new Date(d))
}
function localDate(d){
return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo"}).format(new Date(d))
}
function clock(d){
return new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit"}).format(new Date(d))
}

function renderNews(){
let d=+$("newsFilter").value,f=$("readFilter").value;
let a=news.filter(n=>ageHours(n.publishedAt)<=d*24&&(f=="ALL"||(f=="READ"?n.read:!n.read)));
$("news").innerHTML=a.length?a.slice(0,20).map(n=>{
let i=news.indexOf(n);
return`<article class="news ${n.read?"":"unread"}" onclick="openNews(${i})">
<div class="nmeta"><span class="source">${escapeHTML(n.source||"NEWS")}</span><i class="dot"></i><span class="time">${relativeTime(n.publishedAt)}</span></div>
<div class="nt">${escapeHTML(n.title)}</div>
<div class="nj">${dateText(n.publishedAt)}</div>
<div class="nbottom"><span class="read">${n.read?"READ":"UNREAD"}</span><span class="published">${escapeHTML(n.source||"")}</span><button class="save ${n.saved?"on":""}" onclick="event.stopPropagation();fav(${i})"></button></div>
</article>`
}).join(""):`<div style="padding:35px;text-align:center;color:var(--m);font-size:7px;font-weight:900">NO ARTICLES</div>`
}
function openNews(i){
if(!news[i])return;
news[i].read=true;
try{localStorage.setItem("philly-news-read",JSON.stringify(news.filter(x=>x.read).map(x=>x.link)))}catch(e){}
if(news[i].link)location.href=news[i].link
}
function fav(i){news[i].saved=!news[i].saved;renderNews()}

function renderStandings(){
let a=standings.slice().sort((x,y)=>(+x.divisionRank||99)-(+y.divisionRank||99));
$("standings").innerHTML=a.map(t=>`
<tr class="${t.abbreviation=="PHI"?"phi":""}">
<td class="rank">${t.divisionRank||"—"}</td>
<td class="tn">${escapeHTML(t.abbreviation||"")}</td>
<td class="num">${t.wins??"—"}</td><td class="num">${t.losses??"—"}</td><td class="num">${t.gamesBack=="-"?"—":escapeHTML(t.gamesBack??"—")}</td>
</tr>`).join("")||`<tr><td colspan="5" style="text-align:center;padding:25px;color:var(--m)">NO DATA</td></tr>`
}

function normalizeSchedule(data){
let out=[];
(data.dates||[]).forEach(d=>(d.games||[]).forEach(g=>{
let home=g.teams?.home?.team,away=g.teams?.away?.team;
let phiHome=home?.id===143,phiAway=away?.id===143,phi=phiHome||phiAway;
if(!phi)return;
let ph=g.teams?.[phiHome?"home":"away"],opp=g.teams?.[phiHome?"away":"home"];
let status=g.status||{};
let score=ph?.score??null,oppScore=opp?.score??null;
let state=status.abstractGameState==="Final"?"FINAL":status.detailedState||status.abstractGameState||"SCHEDULED";
let result=state==="FINAL"?(score>oppScore?"W":score<oppScore?"L":"T"):"";
out.push({pk:g.gamePk,date:g.gameDate||d.date,officialDate:d.date,time:g.gameDate||d.date,venue:g.venue?.name||"",home:phiHome,opp:opp?.team?.name||"",oppAbbr:opp?.team?.abbreviation||"",phiScore:score,oppScore,status:state,result,probable:g.teams?.[phiHome?"home":"away"]?.probablePitcher?.fullName||"",linescore:g.linescore})
}));
return out.sort((a,b)=>new Date(a.date)-new Date(b.date))
}

function scheduleClass(g){
let today=localDate(g.date),now=localDate(new Date()),c="next";
if(g.status==="FINAL")c=g.result==="W"?"win":"loss";
if(today===now)c+=" today";
return c
}
function renderSchedule(){
let f=$("scheduleFilter").value,now=localDate(new Date());
let a=schedule.filter(g=>{
let d=localDate(g.date),type=g.status==="FINAL"?"PAST":d===now?"TODAY":"UPCOMING";
return f==="ALL"||f===type
});
if(!a.length){$("scheduleList").innerHTML='<div class="schedule-loading">NO GAMES</div>';return}
let groups={};
a.forEach(g=>{let k=localDate(g.date);(groups[k]??=[]).push(g)});
$("scheduleList").innerHTML=Object.entries(groups).map(([d,arr])=>`
<section class="schedule-day">
<div class="schedule-date"><b>${new Intl.DateTimeFormat("en-US",{weekday:"short",month:"short",day:"numeric"}).format(new Date(arr[0].date))}</b><span>${arr[0].venue||""}</span><i></i></div>
${arr.map(g=>`
<article class="schedule-game ${scheduleClass(g)}" onclick="${g.status==="FINAL"||g.status==="LIVE"||g.status==="IN_PROGRESS"?`game(${g.pk})`:""}">
<div class="schedule-top"><span>${g.home?"HOME":"AWAY"} · ${clock(g.date)}</span><span class="schedule-status">${g.status==="FINAL"?g.result:g.status}</span></div>
<div class="schedule-teams">
<div class="schedule-team"><b>PHI</b><small>Philadelphia Phillies</small></div>
<div class="schedule-score">${g.status==="FINAL"||g.status==="LIVE"||g.status==="IN_PROGRESS"?`${g.phiScore??0}–${g.oppScore??0}`:"VS"}<small>${g.status==="FINAL"?"FINAL":g.status==="LIVE"||g.status==="IN_PROGRESS"?"LIVE":""}</small></div>
<div class="schedule-team"><b>${escapeHTML(g.oppAbbr||"OPP")}</b><small>${escapeHTML(g.opp)}</small></div>
</div>
<div class="schedule-meta"><span>${escapeHTML(g.venue)}</span><span>${g.probable?"SP "+escapeHTML(g.probable):"SCHEDULED"}</span></div>
</article>`).join("")}
</section>`).join("")
}

function inningsHTML(g){
let ls=g.linescore||{},inn=ls.innings||[];
if(!inn.length)return"";
let rows=[
["PHI",inn.map(x=>x.home?.runs??x.home?.runs??0),ls.teams?.home?.runs??0,ls.teams?.home?.hits??0,ls.teams?.home?.errors??0],
[g.oppAbbr,inn.map(x=>x.away?.runs??x.away?.runs??0),ls.teams?.away?.runs??0,ls.teams?.away?.hits??0,ls.teams?.away?.errors??0]
];
return rows.map((r,i)=>`<tr><td>${r[0]}</td>${r[1].map(x=>`<td>${x}</td>`).join("")}<td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join("")
}

async function game(pk){
let g=schedule.find(x=>String(x.pk)===String(pk));
if(!g)return;
detail(`<div class="game-detail"><div class="detail-head"><button class="back" onclick="closeGame()">‹</button><div><div class="detail-title">GAME CENTER</div><div class="detail-sub">LOADING · ${dateText(g.date)}</div></div></div><div class="schedule-loading">LOADING GAME DATA</div></div>`);
try{
let r=await fetch(`${MLB}/game/${pk}/feed/live`,{cache:"no-store"}),j=await r.json(),gd=j.gameData,live=j.liveData,status=gd?.status||{},ls=live?.linescore||{},box=live?.boxscore||{};
let teams=gd?.teams||{},ph=teams.home?.id===143?"home":"away",oppSide=ph==="home"?"away":"home",phTeam=teams[ph],oppTeam=teams[oppSide],ps=ls.teams?.[ph]||{},os=ls.teams?.[oppSide]||{};
let bats=box.teams?.[ph]?.players||{},pits=box.teams?.[ph]?.pitchers||[];
let batRows=Object.values(bats).map(x=>x.stats&&x.person?{name:x.person.fullName,ab:x.stats.atBats??0,h:x.stats.hits??0,hr:x.stats.homeRuns??0,rbi:x.stats.rbi??0,order:x.battingOrder}:null).filter(Boolean).sort((a,b)=>(a.order||999)-(b.order||999));
let pitRows=pits.map(id=>{let x=box.teams?.[ph]?.players?.["ID"+id];return x?{name:x.person.fullName,ip:x.stats?.inningsPitched||"0.0",h:x.stats?.hits??0,er:x.stats?.earnedRuns??0,k:x.stats?.strikeOuts??0}:null}).filter(Boolean);
let currentBatter=live?.plays?.currentPlay?.matchup?.batter?.fullName||"—",currentPitcher=live?.plays?.currentPlay?.matchup?.pitcher?.fullName||"—";
let inning=ls.currentInning||ls.currentInningOrdinal||status.detailedState||"";
let outs=ls.outs??0,base=[!!ls.offense?.first,!!ls.offense?.second,!!ls.offense?.third];
let runRows=(ls.innings||[]).map(x=>[x.away?.runs??0,x.home?.runs??0]);
let cols=Math.max(9,runRows.length);
let rhead=Array.from({length:cols},(_,i)=>`<th>${i+1}</th>`).join("");
let r1=Array.from({length:cols},(_,i)=>`<td>${runRows[i]?runRows[i][ph==="home"?1:0]??0:""}</td>`).join("");
let r2=Array.from({length:cols},(_,i)=>`<td>${runRows[i]?runRows[i][ph==="home"?0:1]??0:""}</td>`).join("");
detail(`
<div class="game-detail">
<div class="detail-head"><button class="back" onclick="closeGame()">‹</button><div><div class="detail-title">GAME CENTER</div><div class="detail-sub">${escapeHTML(status.detailedState||"GAME")} · ${escapeHTML(inning)}</div></div></div>
<div class="card live-card">
<div class="game-head"><div class="${status.abstractGameState==="Live"?"live":""}">${status.abstractGameState==="Live"?'<i></i>LIVE':"FINAL"}</div><div class="game-state">${escapeHTML(status.detailedState||"")}</div></div>
<div class="score"><span class="team">${ph==="home"?"PHI":escapeHTML(oppTeam.abbreviation)}</span><strong>${phTeam.score??0}–${oppTeam.score??0}</strong><span class="team">${ph==="home"?escapeHTML(oppTeam.abbreviation):"PHI"}</span></div>
<div class="game-foot"><span>${escapeHTML(gd.venue?.name||g.venue)}</span><span>${escapeHTML(inning)}</span></div>
</div>
<div class="section"><b>RUNNING SCORE</b><span>${escapeHTML(status.detailedState||"")}</span></div>
<div class="running"><table><thead><tr><th>TEAM</th>${rhead}<th>R</th><th>H</th><th>E</th></tr></thead><tbody><tr><td>${ph==="home"?"PHI":escapeHTML(oppTeam.abbreviation)}</td>${r1}<td>${phTeam.score??0}</td><td>${ps.hits??0}</td><td>${ps.errors??0}</td></tr><tr><td>${ph==="home"?escapeHTML(oppTeam.abbreviation):"PHI"}</td>${r2}<td>${oppTeam.score??0}</td><td>${os.hits??0}</td><td>${os.errors??0}</td></tr></tbody></table></div>
<div class="section"><b>SUMMARY</b><span>${status.abstractGameState==="Live"?"LIVE STATE":"FINAL STATE"}</span></div>
<div class="summary">
<div class="summary-box"><span class="summary-label">PITCHER</span><span class="summary-main">${escapeHTML(currentPitcher)}</span><span class="summary-sub">CURRENT</span></div>
<div class="summary-box"><span class="summary-label">BATTER</span><span class="summary-main">${escapeHTML(currentBatter)}</span><span class="summary-sub">CURRENT</span></div>
<div class="summary-box"><span class="summary-label">OUTS</span><span class="summary-main">${outs} OUT</span><span class="summary-sub">${escapeHTML(inning)}</span></div>
<div class="summary-box"><span class="summary-label">RUNNERS</span><div class="bases"><i class="base ${base[0]?"on":""}"></i><i class="base ${base[1]?"on":""}"></i><i class="base ${base[2]?"on":""}"></i></div><span class="summary-sub">${base.filter(Boolean).length?"BASES OCCUPIED":"BASES EMPTY"}</span></div>
</div>
<div class="section"><b>PHILLIES BATTING ORDER</b><span>GAME STATS</span></div>
<div class="line-table"><table><colgroup><col style="width:29px"><col><col style="width:43px"><col style="width:43px"><col style="width:43px"><col style="width:43px"></colgroup><thead><tr><th>#</th><th>PLAYER</th><th>AB</th><th>H</th><th>HR</th><th>RBI</th></tr></thead><tbody>
${batRows.map((p,i)=>`<tr class="${String(p.order||"").slice(-1)!=="0"?"sub-player":""}"><td class="num-order">${i+1}</td><td><span class="player-name">${escapeHTML(p.name)}</span><small class="position">BATTER</small></td><td>${p.ab}</td><td>${p.h}</td><td>${p.hr}</td><td>${p.rbi}</td></tr>`).join("")}
</tbody></table></div>
<div class="section"><b>PHILLIES PITCHING</b><span>APPEARANCE ORDER</span></div>
<div class="pitch-table"><table><colgroup><col class="order"><col><col class="ip"><col class="stat"><col class="stat"><col class="stat"></colgroup><thead><tr><th>#</th><th>PITCHER</th><th>IP</th><th>H</th><th>ER</th><th>SO</th></tr></thead><tbody>
${pitRows.map((p,i)=>`<tr><td class="order">${i+1}</td><td class="pitcher">${escapeHTML(p.name)}<small class="pitch-sub">${p.ip} IP</small></td><td>${p.ip}</td><td class="stat">${p.h}</td><td class="stat">${p.er}</td><td class="stat">${p.k}</td></tr>`).join("")}
</tbody></table></div>
</div>`);
}catch(e){
detail(`<div class="game-detail"><div class="detail-head"><button class="back" onclick="closeGame()">‹</button><div><div class="detail-title">GAME CENTER</div><div class="detail-sub">${dateText(g.date)}</div></div></div><div class="schedule-loading">GAME DATA UNAVAILABLE</div></div>`)
}
}

function renderHomeGame(){
let now=localDate(new Date()),g=schedule.find(x=>localDate(x.date)===now&&x.status!=="FINAL");
if(!g)g=schedule.filter(x=>x.status==="FINAL").at(-1);
if(!g){$("homeLive").innerHTML='<div class="card"><div class="schedule-loading">NO GAME DATA</div></div>';return}
let live=g.status==="LIVE"||g.status==="IN_PROGRESS";
$("homeGameLabel").textContent=live?"LIVE GAME":g.status==="FINAL"?"LATEST RESULT":"GAME DAY";
$("homeLive").innerHTML=`<div class="card live-card">
<div class="game-head"><div class="${live?"live":""}">${live?'<i></i>LIVE':g.status}</div><div class="game-state">${escapeHTML(live?g.status:dateText(g.date))}</div></div>
<div class="score"><span class="team">PHI</span><strong>${g.status==="FINAL"||live?`${g.phiScore??0}–${g.oppScore??0}`:"VS"}</strong><span class="team">${escapeHTML(g.oppAbbr)}</span></div>
<div class="game-foot"><span>${escapeHTML(g.venue)}</span><span>${live?"LIVE":g.status==="FINAL"?g.result:clock(g.date)}</span></div>
<button class="game-btn" onclick="game(${g.pk})">OPEN GAME CENTER</button>
</div>`
}

/* PLAYERS */
const groups=["PITCHERS","CATCHERS","INFIELDERS","OUTFIELDERS","DH"];
const groupNames={PITCHERS:"PITCHERS",CATCHERS:"CATCHERS",INFIELDERS:"INFIELDERS",OUTFIELDERS:"OUTFIELDERS",DH:"DESIGNATED HITTERS"};
function rosterClass(p){if(p.il)return"il";if(p.active)return"active";return"man40"}
function rosterState(p){const s=(p.roster?.status?.description||"").toLowerCase();if(p.roster?.status?.code==="A"||s==="active")return"ACTIVE";if(s.includes("injured")||s.includes("injured list")||s.includes("disabled"))return"IL";return"40-MAN"}
function positionGroup(p){const a=(p.position?.abbreviation||"").toUpperCase(),n=(p.position?.name||"").toLowerCase();if(a==="DH"||n.includes("designated hitter"))return"DH";if(n.includes("pitch")||a==="P")return"PITCHERS";if(n.includes("catch")||a==="C")return"CATCHERS";if(["1B","2B","3B","SS"].includes(a)||n.includes("base")||n.includes("shortstop")||n.includes("infielder"))return"INFIELDERS";return"OUTFIELDERS"}
function normalizePlayer(p){const state=rosterState(p);return{raw:p,id:p.id,name:p.name||"",number:p.number||"",position:p.position?.abbreviation||"",detailPosition:p.position?.name||"",bt:p.bt?`${p.bt.bats}/${p.bt.throws}`:"",birthCountry:p.physical?.birthCountry||"—",birthDate:p.physical?.birthDate||"—",active:state==="ACTIVE",il:state==="IL",roster:state,group:positionGroup(p),type:p.stats?.type||""}}
function fmtDate(v){if(!v||v==="—")return"—";const d=new Date(v+"T00:00:00");return isNaN(d)?"—":d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}
function calcAge(v){if(!v)return"—";const d=new Date(v+"T00:00:00"),now=new Date();let a=now.getFullYear()-d.getFullYear();if(now.getMonth()<d.getMonth()||(now.getMonth()===d.getMonth()&&now.getDate()<d.getDate()))a--;return a}
function statValue(v,d=2){if(v===null||v===undefined||v==="")return"—";if(typeof v==="number"){if(v===0)return"0";return Math.abs(v)>=10?v.toFixed(1):v.toFixed(d)}return v}
function statsFor(p){const s=p.raw.stats||{},h=s.hitting?.season,hs=s.hitting?.sabermetrics,q=s.pitching?.season,qs=s.pitching?.sabermetrics;if(p.type==="pitcher")return[["G",q?.gamesPlayed],["IP",q?.inningsPitched],["W-L",q?`${q.wins}-${q.losses}`:"—"],["ERA",q?.era],["WAR",qs?.war],["FIP",qs?.fip],["xFIP",qs?.xfip],["WHIP",q?.whip]];return[["G",h?.gamesPlayed],["AVG",h?.avg],["HR",h?.homeRuns],["RBI",h?.rbi],["WAR",hs?.war],["OPS",h?.ops],["wOBA",hs?.woba],["BABIP",h?.babip]]}
function detailCard(p){const stats=statsFor(p),role=p.type==="pitcher"?"PITCHER":p.position==="DH"?"DESIGNATED HITTER":"POSITION PLAYER";return`<div class="player-stats"><div class="player-profile"><div><div class="player-profile-name">${escapeHTML(p.name)}</div><div class="player-profile-role">${role} · ${escapeHTML(p.detailPosition)} · ${escapeHTML(p.bt)}</div></div><div class="player-profile-number"><b>${escapeHTML(p.number)}</b><span>ROSTER NUMBER</span></div></div><div class="player-bio"><div class="player-bio-item"><small>BIRTH COUNTRY</small><b>${escapeHTML(p.birthCountry)}</b></div><div class="player-bio-item"><small>BIRTH DATE</small><b>${escapeHTML(fmtDate(p.birthDate))}</b></div><div class="player-bio-item"><small>AGE</small><b>${calcAge(p.birthDate)}</b></div></div><div class="stat-caption"><b>SEASON</b><span>${p.type==="pitcher"?"PITCHING":"BATTING"}</span><i></i></div><div class="player-stat-grid">${stats.map(([label,value])=>`<div class="player-stat ${label==="WAR"?"war":""}"><small>${label}</small><b>${statValue(value)}</b></div>`).join("")}</div></div>`}
function togglePlayer(i){opened=opened===i?null:i;renderPlayers();if(opened!==null)setTimeout(()=>{const e=$("player-"+opened);if(e)e.scrollIntoView({behavior:"smooth",block:"nearest"})},40)}
function renderPlayers(){
const pos=$("positionFilter").value,rf=$("rosterFilter").value;
let list=rosterData.filter(p=>(rf==="ALL"||p.roster===rf)&&(pos==="ALL"||p.group===pos)).sort((a,b)=>(+a.number||999)-(+b.number||999));
$("playerCount").textContent=list.length+" PLAYERS";
const gs=pos==="ALL"?groups:[pos];
$("playerList").innerHTML=gs.map(g=>{const a=list.filter(p=>p.group===g);if(!a.length)return"";return`<section class="player-group"><div class="player-group-head"><b>${groupNames[g]}</b><span>${a.length}</span><i></i></div><div class="player-list">${a.map(p=>{const i=rosterData.indexOf(p),c=rosterClass(p),open=opened===i;return`<div class="player-wrap" id="player-${i}"><div class="player-card ${c} ${open?"open":""}" onclick="togglePlayer(${i})"><div class="player-number">${escapeHTML(p.number)}</div><div class="player-info"><span class="player-name">${escapeHTML(p.name)}</span><div class="player-role"><span class="player-bt">${escapeHTML(p.bt)}</span><span class="player-roster ${c}">${p.roster}</span></div></div><div class="player-position-large">${escapeHTML(p.position)}<span class="player-position-label">POSITION</span></div></div>${open?detailCard(p):""}</div>`}).join("")}</div></section>`}).join("")||`<div class="player-empty">NO PLAYERS MATCH THE CURRENT FILTER</div>`
}

async function load(){
try{
let saved=[];try{saved=JSON.parse(localStorage.getItem("philly-news-read")||"[]")}catch(e){}
let [n,s,p]=await Promise.all([
fetch(RAW+"news.json",{cache:"no-store"}).then(r=>r.json()),
fetch(RAW+"standings.json",{cache:"no-store"}).then(r=>r.json()),
fetch(RAW+"players.json",{cache:"no-store"}).then(r=>r.json())
]);
news=(n||[]).map(x=>({...x,read:saved.includes(x.link),saved:false}));
standings=s?.division?.teams||[];
rosterData=(p?.players||[]).map(normalizePlayer).filter(x=>x.active||x.il||x.raw.roster?.fortyMan);
renderNews();renderStandings();renderPlayers();
}catch(e){
$("news").innerHTML='<div class="schedule-loading">DATA UNAVAILABLE</div>';
$("standings").innerHTML='<tr><td colspan="5" style="text-align:center;padding:25px;color:var(--m)">DATA UNAVAILABLE</td></tr>';
}
try{
let r=await fetch(`${MLB}/schedule?sportId=1&teamId=143&season=2026&startDate=2026-03-01&endDate=2026-11-01&hydrate=team,venue,probablePitcher,linescore`,{cache:"no-store"});
let j=await r.json();schedule=normalizeSchedule(j);renderSchedule();renderHomeGame();
}catch(e){
$("scheduleList").innerHTML='<div class="schedule-loading">SCHEDULE DATA UNAVAILABLE</div>';
}
}

load();

setInterval(async()=>{
if(!schedule.length)return;
try{
let r=await fetch(`${MLB}/schedule?sportId=1&teamId=143&season=2026&startDate=${localDate(new Date())}&endDate=${localDate(new Date())}&hydrate=team,venue,probablePitcher,linescore`,{cache:"no-store"}),j=await r.json();
let today=normalizeSchedule(j);
if(today.length){
schedule=schedule.filter(g=>localDate(g.date)!==localDate(new Date())).concat(today).sort((a,b)=>new Date(a.date)-new Date(b.date));
renderSchedule();renderHomeGame()
}
}catch(e){}
},60000);
</script>
