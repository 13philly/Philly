.latest-head{display:flex;align-items:center;justify-content:space-between;gap:7px}.latest-head>b{font:900 19px/.8 "Barlow Condensed"}.news-tools{display:flex;gap:5px}.news-select{position:relative}.news-select select{appearance:none;outline:0;height:29px;min-width:67px;padding:0 21px 0 8px;border:1px solid var(--l);border-radius:7px;background:#0a1b34;color:#dce4ed;font-size:5px;font-weight:900}.news-select:after{content:"⌄";position:absolute;right:7px;top:50%;transform:translateY(-55%);color:#7087a2;pointer-events:none}.news-grid{display:grid;gap:10px}.news{position:relative;padding:14px 13px 12px;border:1px solid var(--l);border-radius:14px;background:linear-gradient(145deg,#0d213b,#09192f);box-shadow:0 7px 18px #00022}.news:active{transform:scale(.988)}.news.unread:after{content:"";position:absolute;right:13px;top:15px;width:5px;height:5px;border-radius:50%;background:var(--r)}.nmeta{display:flex;align-items:center;gap:6px;margin-bottom:7px}.source{font-size:5px;color:#ff6078;font-weight:900}.dot{width:3px;height:3px;border-radius:50%;background:#526b88}.time,.published,.read{font-size:5px;color:#627995}.nt{font:800 18px/1.07 "Barlow Condensed"}.nj{margin-top:6px;color:#9caec2;font-size:8px;line-height:1.4}.nbottom{display:flex;align-items:center;margin-top:11px}.published{margin-left:auto;margin-right:9px}.unread .read{color:#ff6078}.save{position:relative;width:28px;height:28px;border:1px solid #29435f;border-radius:8px;background:#0a1b34;color:#7187a3}.save:before{content:"";position:absolute;left:9px;top:7px;width:8px;height:11px;border:1.3px solid currentColor;border-radius:2px}.save:after{content:"";position:absolute;left:11px;top:14px;width:5px;height:5px;border-left:1.3px solid currentColor;border-bottom:1.3px solid currentColor;transform:rotate(-45deg);background:#0a1b34}.save.on{color:#ff5871;border-color:#e3183755}

.game-detail .section{margin:14px 2px 6px}.game-detail .section>b{font-size:15px}.game-detail .section>span{font-size:4px}

<body>
<div class="app">
<header><img class="header-logo" src="https://raw.githubusercontent.com/13philly/Philly/main/IMG_7708.png" alt=""><div class="header-detail"><b></b><i></i></div></header>

<main id="home" class="page show">
<div class="eyebrow">PHILADELPHIA PHILLIES</div><h1>HOME</h1>
<div class="section"><b>LIVE CENTER</b><span>GAME DAY</span></div>
<div class="card live-card">
<div class="game-head"><div class="live"><i></i>LIVE</div><div class="game-state">7TH · 2 OUT</div></div>
<div class="score"><span class="team">PHI</span><strong>3–1</strong><span class="team">LAD</span></div>
<div class="game-foot"><span>DODGER STADIUM</span><span>TOP 7</span></div>
<button class="game-btn" onclick="game()">OPEN GAME CENTER</button></div>
<div class="section latest-head"><b>LATEST</b><div class="news-tools"><div class="news-select"><select id="newsFilter" onchange="renderNews()"><option value="1">24 HOURS</option><option value="3">3 DAYS</option><option value="7" selected>7 DAYS</option></select></div><div class="news-select"><select id="readFilter" onchange="renderNews()"><option>ALL</option><option>UNREAD</option><option>READ</option></select></div></div></div>
<div id="news" class="news-grid"></div>
<div class="section"><b>NL EAST</b><span>STANDINGS</span></div>
<div class="card stand"><table><thead><tr><th>#</th><th>TEAM</th><th>W</th><th>L</th><th>GB</th></tr></thead><tbody>
<tr class="phi"><td class="rank">1</td><td class="tn">PHI <i class="mark">POST</i></td><td class="num">72</td><td class="num">45</td><td class="num">—</td></tr><tr><td class="rank">2</td><td class="tn">ATL</td><td class="num">67</td><td class="num">50</td><td class="num">5.0</td></tr><tr><td class="rank">3</td><td class="tn">NYM</td><td class="num">63</td><td class="num">54</td><td class="num">9.0</td></tr><tr><td class="rank">4</td><td class="tn">MIA</td><td class="num">51</td><td class="num">66</td><td class="num">21.0</td></tr><tr><td class="rank">5</td><td class="tn">WSH</td><td class="num">48</td><td class="num">69</td><td class="num">24.0</td></tr>
</tbody></table></div></main>

<main id="schedule" class="page"><div class="empty">SCHEDULE</div></main>
<main id="players" class="page"><div class="empty">PLAYERS</div></main><section id="detail"></section>

<nav class="bottom-nav"><div class="nav-inner">
<button id="ns" class="nav-item" onclick="go('schedule')"><span class="nav-icon schedule-icon"></span><span>SCHEDULE</span></button>
<button id="nh" class="nav-item active" onclick="go('home')"><span class="nav-icon home-icon"></span><span>HOME</span></button>
<button id="np" class="nav-item" onclick="go('players')"><span class="nav-icon players-icon"></span><span>PLAYERS</span></button>
</div></nav></div>

<script>
const $=id=>document.getElementById(id),news=[
["MLB.COM","Phillies strengthen bullpen ahead of stretch run","フィリーズ、終盤戦を前にブルペンを強化","2H","AUG 13 · 21:42",0,0],["ESPN","Phillies lineup continues to produce at the plate","フィリーズ打線、好調な打撃を継続","11H","AUG 13 · 12:36",0,1],["PHILLIES NATION","Philadelphia prepares for important divisional series","フィラデルフィア、重要な地区シリーズへ準備","1D","AUG 12 · 18:05",1,0],["MLB.COM","Harper continues to lead Philadelphia offense","ハーパーがフィリーズ打線を牽引","1D","AUG 12 · 10:21",1,0],["MLB.COM","Phillies complete another strong series","フィリーズ、シリーズを勝ち越し","2D","AUG 11 · 16:48",1,0],["ESPN","Philadelphia bullpen delivers late","フィリーズ救援陣が終盤に好投","3D","AUG 10 · 20:14",1,0],["PHILADELPHIA INQUIRER","Phillies continue their push in the NL East","フィリーズ、NL東地区で前進","5D","AUG 8 · 14:32",1,0],["MLB.COM","Turner gives Phillies another offensive spark","ターナーが打線に新たな勢い","6D","AUG 7 · 19:08",1,0]
];
function age(x){let m=x.match(/^(\d+)([HD])$/);return m?(m[2]=="H"?m[1]/24:+m[1]):99}
function renderNews(){let d=+$("newsFilter").value,f=$("readFilter").value,a=news.filter(n=>age(n[3])<=d&&(f=="ALL"||(f=="READ"?n[5]:!n[5])));$("news").innerHTML=a.length?a.map(n=>{let i=news.indexOf(n);return`<article class="news ${n[5]?"":"unread"}" onclick="readNews(${i})"><div class="nmeta"><span class="source">${n[0]}</span><i class="dot"></i><span class="time">${n[3]}</span></div><div class="nt">${n[1]}</div><div class="nj">${n[2]}</div><div class="nbottom"><span class="read">${n[5]?"READ":"UNREAD"}</span><span class="published">${n[4]}</span><button class="save ${n[6]?"on":""}" onclick="event.stopPropagation();fav(${i})"></button></div></article>`}).join(""):`<div style="padding:35px;text-align:center;color:var(--m);font-size:7px;font-weight:900">NO ARTICLES</div>`}
function readNews(i){news[i][5]=1;renderNews()}function fav(i){news[i][6]^=1;renderNews()}
function go(id){["home","schedule","players"].forEach(x=>$(x).classList.toggle("show",x==id));["h","s","p"].forEach(x=>$("n"+x).classList.toggle("active",x==={home:"h",schedule:"s",players:"p"}[id]));$("detail").innerHTML="";scrollTo(0,0)}
function closeGame(){go("home")}function detail(x){["home","schedule","players"].forEach(x=>$(x).classList.remove("show"));$("detail").innerHTML=x;scrollTo(0,0)}

const lineup=[
["1",[["Kyle Schwarber",3,1,2,2,"DH"],["Trea Turner",1,1,1,0,"SS"]]],
["2",[["Bryce Harper",3,1,1,1,"1B"]]],
["3",[["Nick Castellanos",3,0,1,0,"RF"]]],
["4",[["Alec Bohm",3,0,1,0,"3B"]]],
["5",[["J.T. Realmuto",2,1,1,0,"C"]]],
["6",[["Brandon Marsh",3,0,0,0,"CF"]]],
["7",[["Max Kepler",3,0,1,0,"LF"]]],
["8",[["Bryson Stott",3,0,0,0,"2B"]]],
["9",[["Johan Rojas",3,0,0,0,"CF"]]]
];

function lineupRows(){return lineup.map(([num,ps])=>ps.map((p,i)=>`<tr>${i?``:`<td class="num-order" rowspan="${ps.length}">${num}</td>`}<td><div class="line-player ${i?"sub-player":""}"><span class="player-name">${p[0]}</span><small class="position">${p[5]}</small></div></td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td>${p[4]}</td></tr>`).join("")).join("")}

function game(){detail(`<div class="game-detail">
<div class="detail-head"><button class="back" onclick="closeGame()">‹</button><div><div class="detail-title">GAME CENTER</div><div class="detail-sub">LIVE · AUG 13 · 7TH</div></div></div>
<div class="card live-card"><div class="game-head"><div class="live"><i></i>LIVE</div><div class="game-state">7TH · 2 OUT</div></div><div class="score"><span class="team">PHI</span><strong>3–1</strong><span class="team">LAD</span></div><div class="game-foot"><span>DODGER STADIUM</span><span>TOP 7</span></div></div>
<div class="section"><b>INNING SCORE</b><span>LIVE</span></div>
<div class="running"><table><thead><tr><th>TEAM</th>${[1,2,3,4,5,6,7,8,9].map(x=>`<th>${x}</th>`).join("")}<th>R</th><th>H</th><th>E</th></tr></thead><tbody>
<tr><td>PHI</td><td>1</td><td>0</td><td>1</td><td>0</td><td>1</td><td>0</td><td>0</td><td>—</td><td>—</td><td>3</td><td>7</td><td>0</td></tr>
<tr><td>LAD</td><td>0</td><td>0</td><td>0</td><td>1</td><td>0</td><td>0</td><td>0</td><td>—</td><td>—</td><td>1</td><td>5</td><td>1</td></tr>
</tbody></table></div>
<div class="section"><b>GAME STATE</b><span>CURRENT</span></div><div class="summary">
<div class="summary-box"><span class="summary-label">PITCHER</span><span class="summary-main">ZACK WHEELER</span><span class="summary-sub">RHP · 92 PITCHES</span></div>
<div class="summary-box"><span class="summary-label">BATTER</span><span class="summary-main">KYLE SCHWARBER</span><span class="summary-sub">DH · 2 FOR 3</span></div>
<div class="summary-box"><span class="summary-label">COUNT</span><span class="summary-main">2–1</span><span class="summary-sub">TOP 7TH · 2 OUT</span></div>
<div class="summary-box"><span class="summary-label">RUNNERS</span><div class="bases"><i class="base"></i><i class="base on"></i><i class="base"></i></div><span class="summary-sub">RUNNER ON 2B</span></div>
</div>
<div class="section"><b>PHILLIES BATTING ORDER</b><span>AB · R · H · RBI</span></div>
<div class="line-table"><table><colgroup><col style="width:25px"><col><col style="width:34px"><col style="width:34px"><col style="width:34px"><col style="width:38px"></colgroup><thead><tr><th>#</th><th>PLAYER</th><th>AB</th><th>R</th><th>H</th><th>RBI</th></tr></thead><tbody>${lineupRows()}</tbody></table></div>
