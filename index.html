<div class="gc-section">PHILLIES BATTING ORDER</div><div class="line-table"><div class="table-head"><span>#</span><span>PLAYER</span><span>AB</span><span>H</span><span>RBI</span></div>${lineup.map(x=>`<div class="line-row"><span class="line-num">${x[0]}</span><span><b class="line-name">${x[1]}</b><small class="line-pos">${x[2]}</small></span><span class="line-stat">${x[3]}</span><span class="line-stat">${x[4]}</span><span class="line-stat">${x[5]}</span></div>`).join("")}</div>

<button class="back-home" onclick="go('home')">BACK TO HOME</button>`;

}
