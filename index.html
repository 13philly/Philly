<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e31837">
<title>Phillies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#061225;--bg2:#091a32;--card:#0c203b;--card2:#112a48;--line:#1b385b;--red:#e31837;--red2:#ff4058;--white:#f5f7fb;--muted:#7890ad;--soft:#aab9cc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 50% -8%,#1b3c68 0,#0a1b34 31%,#061225 68%)}
button,select{font:inherit;cursor:pointer}
.app{max-width:560px;min-height:100vh;margin:auto;padding-bottom:88px}

header{position:sticky;top:0;z-index:30;height:76px;display:flex;align-items:center;padding:0 16px;overflow:hidden;background:linear-gradient(110deg,#c9102f,#e31837 54%,#a80e29);box-shadow:0 10px 30px #0006}
header:before{content:"";position:absolute;left:0;top:0;width:62%;height:100%;background:linear-gradient(115deg,#ffffff0c 0 38%,transparent 39%);transform:skewX(-18deg)}
header:after{content:"";position:absolute;right:-50px;top:-70px;width:210px;height:210px;border:28px solid #ffffff0b;border-radius:50%}
.header-logo{position:relative;z-index:2;height:51px;width:auto;max-width:205px;object-fit:contain;filter:drop-shadow(0 4px 8px #0004)}
.header-line{position:absolute;right:16px;bottom:10px;width:76px;height:2px;background:#ffffff66;border-radius:2px}
.header-line:after{content:"";display:block;width:24px;height:2px;margin-top:4px;background:#ffffff2e}

.page{display:none;padding:22px 15px}
.page.show{display:block}
.eyebrow{font-size:6px;font-weight:900;color:var(--muted);letter-spacing:1.6px;margin-bottom:5px}
h1{margin:0;font:900 46px/.82 "Barlow Condensed";letter-spacing:-.5px}
.section{display:flex;align-items:end;justify-content:space-between;margin:27px 2px 10px}
.section b{font:900 19px/.8 "Barlow Condensed";letter-spacing:.4px}
.section span{font-size:5px;color:var(--muted);font-weight:900;letter-spacing:1px}

.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--card2),var(--card));box-shadow:0 14px 35px #0003}

.live-card{position:relative;overflow:hidden}
.live-card:before{content:"";position:absolute;right:-70px;top:-85px;width:210px;height:210px;border-radius:50%;border:34px solid #e3183714}
.live-card:after{content:"";position:absolute;left:-80px;bottom:-110px;width:190px;height:190px;border-radius:50%;background:#1a477522}
.game-head{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.live{display:flex;align-items:center;gap:7px;color:#ff647d;font-size:6px;font-weight:900;letter-spacing:1px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px #e3183720}
.game-state{font-size:6px;color:var(--muted);font-weight:900}
.score{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:14px;padding:35px 15px 31px}
.score strong{font:900 59px/.75 "Barlow Condensed";letter-spacing:-1px}
.score .team{font:900 29px/.8 "Barlow Condensed";letter-spacing:.5px}
.game-foot{position:relative;z-index:2;display:flex;justify-content:space-between;padding:11px 16px;border-top:1px solid var(--line);font-size:5px;color:var(--muted);font-weight:900;letter-spacing:.6px}
.game-btn{position:relative;z-index:2;margin:0 16px 16px;width:calc(100% - 32px);padding:12px;border:1px solid #ff5268;background:linear-gradient(180deg,#ed2342,#c9102f);border-radius:9px;color:#fff;font-size:6px;font-weight:900;letter-spacing:.8px}

.news-tools{display:flex;align-items:center;gap:7px}
.news-tools label{font-size:5px;color:var(--muted);font-weight:900;letter-spacing:.8px}
.news-select{position:relative}
.news-select select{appearance:none;outline:0;border:1px solid var(--line);border-radius:8px;background:#0b213d;color:#dce5ef;padding:8px 25px 8px 9px;font-size:5px;font-weight:900;letter-spacing:.5px}
.news-select:after{content:"⌄";position:absolute;right:8px;top:50%;transform:translateY(-54%);color:#7188a5;font-size:9px;pointer-events:none}

.news-grid{display:grid;gap:9px}
.news{position:relative;padding:15px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#102744,#0a1c35);transition:.15s;overflow:hidden}
.news:active{transform:scale(.985)}
.news.feature{padding:18px;background:linear-gradient(145deg,#17365d,#0b1d36)}
.news.unread{border-left:3px solid var(--red)}
.news.unread:after{content:"";position:absolute;right:14px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px #e3183715}
.nmeta{display:flex;gap:7px;align-items:center;margin-bottom:9px}
.source{font-size:5px;color:#ff6279;font-weight:900;letter-spacing:1px}
.dot{width:3px;height:3px;border-radius:50%;background:#526b89}
.time{font-size:5px;color:#657d9a}
.nt{font:800 19px/1.06 "Barlow Condensed";padding-right:28px}
.feature .nt{font-size:25px}
.nj{margin-top:7px;color:var(--soft);font-size:8px;line-height:1.45}
.nbottom{display:flex;justify-content:space-between;align-items:center;margin-top:13px}
.read{font-size:5px;color:#657d9a;font-weight:900;letter-spacing:.5px}
.unread .read{color:var(--red2)}
.save{width:29px;height:29px;border:1px solid #2a4565;border-radius:9px;background:#0b213d;color:#7188a5;display:grid;place-items:center;position:relative}
.save:before{content:"";width:9px;height:12px;border:1.5px solid currentColor;border-radius:2px 2px 1px 1px}
.save:after{content:"";position:absolute;top:15px;width:5px;height:5px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);background:#0b213d}
.save.on{border-color:#e3183755;background:#291827;color:#ff5c74}

.stand{overflow:hidden}
.stand-head,.teamrow{display:grid;grid-template-columns:28px 1fr repeat(3,38px)}
.stand-head{padding:10px 11px;background:#07172d;color:#617995;font-size:5px;font-weight:900}
.teamrow{align-items:center;padding:12px 11px;border-top:1px solid var(--line);font-size:7px}
.teamrow.phi{background:linear-gradient(90deg,#17345c,#0d213d)}
.rank{font:900 16px "Barlow Condensed";color:#7187a3}
.tn{font-weight:900}
.num{text-align:right;font:800 11px "Barlow Condensed"}
.mark{margin-left:5px;padding:2px 4px;border-radius:3px;background:var(--red);font-size:4px;color:#fff;font-style:normal}

.empty{min-height:70vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font:900 12px "Barlow Condensed";letter-spacing:1px}

nav{position:fixed;z-index:40;bottom:0;left:50%;width:100%;max-width:560px;height:82px;padding-bottom:env(safe-area-inset-bottom);transform:translateX(-50%);display:flex;background:#07162bed;border-top:1px solid var(--line);backdrop-filter:blur(20px)}
nav button{flex:1;border:0;background:none;color:#607995;font-size:5px;font-weight:900;letter-spacing:.8px}
nav b{display:block;height:30px;font:900 22px/30px "Barlow Condensed"}
nav .active{color:#fff}
nav .active b{color:var(--red)}
</style>
</head>
<body>
<div class="app">

<header>
<img class="header-logo" src="https://raw.githubusercontent.com/13philly/Philly/main/IMG_7708.png" alt="">
<div class="header-line"></div>
</header>

<main id="home" class="page show">
<div class="eyebrow">PHILADELPHIA PHILLIES</div>
<h1>HOME</h1>

<div class="section"><b>LIVE CENTER</b><span>GAME DAY</span></div>

<div class="card live-card">
<div class="game-head">
<div class="live"><i></i>LIVE</div>
<div class="game-state">7TH · 2 OUT</div>
</div>
<div class="score">
<span class="team">PHI</span>
<strong>3–1</strong>
<span class="team">LAD</span>
</div>
<div class="game-foot">
<span>DODGER STADIUM</span>
<span>TOP 7</span>
</div>
<button class="game-btn" onclick="alert('Game Center')">OPEN GAME CENTER</button>
</div>

<div class="section">
<b>LATEST</b>
<div class="news-tools">
<label>WITHIN</label>
<div class="news-select">
<select id="newsFilter" onchange="renderNews()">
<option value="1">24 HOURS</option>
<option value="3">3 DAYS</option>
<option value="7" selected>7 DAYS</option>
</select>
</div>
</div>
</div>

<div id="news" class="news-grid"></div>

<div class="section"><b>NL EAST</b><span>STANDINGS</span></div>
<div class="card stand">
<div class="stand-head"><span>#</span><span>TEAM</span><span>W</span><span>L</span><span>GB</span></div>
<div class="teamrow phi"><span class="rank">1</span><span class="tn">PHI <i class="mark">POST</i></span><span class="num">72</span><span class="num">45</span><span class="num">—</span></div>
<div class="teamrow"><span class="rank">2</span><span class="tn">ATL</span><span class="num">67</span><span class="num">50</span><span class="num">5.0</span></div>
<div class="teamrow"><span class="rank">3</span><span class="tn">NYM</span><span class="num">63</span><span class="num">54</span><span class="num">9.0</span></div>
<div class="teamrow"><span class="rank">4</span><span class="tn">MIA</span><span class="num">51</span><span class="num">66</span><span class="num">21.0</span></div>
<div class="teamrow"><span class="rank">5</span><span class="tn">WSH</span><span class="num">48</span><span class="num">69</span><span class="num">24.0</span></div>
</div>
</main>

<main id="schedule" class="page">
<div class="empty">SCHEDULE</div>
</main>

<main id="players" class="page">
<div class="empty">PLAYERS</div>
</main>

<nav>
<button id="ns" onclick="go('schedule')"><b>▣</b>SCHEDULE</button>
<button id="nh" class="active" onclick="go('home')"><b>⌂</b>HOME</button>
<button id="np" onclick="go('players')"><b>♙</b>PLAYERS</button>
</nav>

</div>

<script>
const $=x=>document.getElementById(x);

const news=[
["MLB.COM","Phillies strengthen bullpen ahead of stretch run","フィリーズ、終盤戦を前にブルペンを強化","2H",0,0,1],
["ESPN","Phillies lineup continues to produce at the plate","フィリーズ打線、好調な打撃を継続","11H",0,1,1],
["PHILLIES NATION","Philadelphia prepares for important divisional series","フィラデルフィア、重要な地区シリーズへ準備","1D",1,0,1],
["MLB.COM","Harper continues to lead Philadelphia offense","ハーパーがフィリーズ打線を牽引","1D",1,0,1],
["MLB.COM","Phillies complete another strong series","フィリーズ、シリーズを勝ち越し","2D",1,0,3],
["ESPN","Philadelphia bullpen delivers late","フィリーズ救援陣が終盤に好投","3D",1,0,3],
["PHILADELPHIA INQUIRER","Phillies continue their push in the NL East","フィリーズ、NL東地区で前進","5D",1,0,7],
["MLB.COM","Turner gives Phillies another offensive spark","ターナーが打線に新たな勢い","6D",1,0,7]
];

function ageDays(t){
let m=t.match(/^(\d+)([HD])$/);
if(!m)return 99;
return m[2]==="H"?+m[1]/24:+m[1];
}

function renderNews(){
let limit=+$("newsFilter").value;
let list=news.filter(n=>ageDays(n[3])<=limit);

$("news").innerHTML=list.length?list.map((n,i)=>`
<article class="news ${i===0&&limit>=7?"feature ":""}${n[4]?"":"unread"}" onclick="readNews(${news.indexOf(n)})">
<div class="nmeta">
<span class="source">${n[0]}</span>
<i class="dot"></i>
<span class="time">${n[3]}</span>
</div>
<div class="nt">${n[1]}</div>
<div class="nj">${n[2]}</div>
<div class="nbottom">
<span class="read">${n[4]?"READ":"UNREAD"}</span>
<button class="save ${n[5]?"on":""}" aria-label="save" onclick="event.stopPropagation();fav(${news.indexOf(n)})"></button>
</div>
</article>`).join(""):`<div style="padding:35px;text-align:center;color:var(--muted);font-size:7px;font-weight:900">NO ARTICLES</div>`;
}

function readNews(i){
news[i][4]=1;
renderNews();
}

function fav(i){
news[i][5]^=1;
renderNews();
}

function go(id){
["home","schedule","players"].forEach(x=>$(x).classList.toggle("show",x===id));
$("nh").classList.toggle("active",id==="home");
$("ns").classList.toggle("active",id==="schedule");
$("np").classList.toggle("active",id==="players");
scrollTo(0,0);
}

renderNews();
</script>
</body>
</html>
